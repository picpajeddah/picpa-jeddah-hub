<style id="tk-style">
/* tk.css — styles of the ticketing pages on Hub v2.2 tokens. Colours appear ONLY in the :root token block.
   Mobile first: the base rules are the phone layout; min-width queries widen it. Class prefix: tk-. */
:root {
  /* brand */
  --navy-900: #0B1540;
  --navy-800: #101E5A;
  --navy-700: #16297A;
  --navy-500: #2149D6;
  --navy-100: #E6ECFB;
  --green-700: #1E6B22;
  --green-500: #3FA62B;
  --green-400: #52A828;
  --green-100: #E8F5E3;
  /* status (each with -ink for text on -bg) */
  --info: #2149D6;  --info-ink: #17349A;  --info-bg: #E8EEFC;
  --good: #1E7A2E;  --good-ink: #155A21;  --good-bg: #E6F4E8;
  --warn: #CA8A04;  --warn-ink: #7A5203;  --warn-bg: #FEF6DC;
  --crit: #DC2626;  --crit-ink: #991B1B;  --crit-bg: #FDECEC;
  /* neutrals */
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8F9FC;
  --line: #DDE2EC;
  --line-strong: #C5CCDA;
  --text: #172033;
  --muted: #5B6478;
  --on-dark: #FFFFFF;
  --on-dark-muted: #B9C3E6;
  --focus: #2149D6;
  --scrim: rgba(11, 21, 64, 0.45);
  /* type */
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px;
  /* spacing, 4px base */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px;
  --s6: 24px; --s7: 32px; --s8: 40px; --s9: 48px; --s10: 64px;
  /* radii */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  /* elevation */
  --e1: 0 1px 2px rgba(11, 21, 64, 0.06), 0 1px 1px rgba(11, 21, 64, 0.04);
  --e2: 0 4px 12px rgba(11, 21, 64, 0.08), 0 1px 3px rgba(11, 21, 64, 0.06);
  --e3: 0 16px 40px rgba(11, 21, 64, 0.18), 0 4px 12px rgba(11, 21, 64, 0.08);
  /* motion */
  --t-fast: 120ms; --t-med: 200ms; --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  /* page width */
  --page-w: 960px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: var(--fs-md); line-height: 1.5; font-feature-settings: 'tnum' 1, 'cv11' 1;
}
a { color: var(--navy-500); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { color: var(--navy-800); line-height: 1.25; margin: 0 0 var(--s3); }
h1 { font-size: var(--fs-xl); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: var(--fs-md); }
p { margin: 0 0 var(--s3); }
.tk-muted { color: var(--muted); }
.tk-mini { font-size: var(--fs-xs); color: var(--muted); }
.tk-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tk-nowrap { white-space: nowrap; }
.tk-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tk-skip { position: absolute; left: -999px; top: var(--s2); }
.tk-skip:focus { left: var(--s2); z-index: 100; background: var(--surface); padding: var(--s2) var(--s3); border-radius: var(--r-sm); }

/* ---------- header */
.tk-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.tk-head-in {
  max-width: var(--page-w); margin: 0 auto; padding: var(--s3) var(--s4);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap;
}
.tk-brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.tk-brand-mark { flex: none; width: 40px; height: 40px; }
.tk-brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.tk-brand-text b { font-size: var(--fs-sm); color: var(--navy-800); }
.tk-brand-text span { font-size: var(--fs-xs); color: var(--green-700); font-weight: 600; }
.tk-back {
  display: inline-flex; align-items: center; min-height: 40px; padding: var(--s1) var(--s3);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); text-decoration: none;
  font-size: var(--fs-sm); font-weight: 600; color: var(--navy-800); background: var(--surface);
}
.tk-back:hover { border-color: var(--navy-500); }
.tk-head-links { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.tk-nav { display: flex; gap: var(--s2); flex-wrap: wrap; }
.tk-navlink {
  display: inline-flex; align-items: center; min-height: 40px; padding: var(--s1) var(--s3);
  border-radius: var(--r-sm); text-decoration: none; font-size: var(--fs-sm); font-weight: 600; color: var(--navy-500);
}
.tk-navlink:hover, .tk-navlink:focus-visible { text-decoration: underline; }

/* ---------- page */
.tk-banner:empty { display: none; }
.tk-banner { max-width: var(--page-w); margin: var(--s4) auto 0; padding: 0 var(--s4); }
.tk-view {
  max-width: var(--page-w); margin: 0 auto; padding: var(--s5) var(--s4) var(--s8);
  display: flex; flex-direction: column; gap: var(--s4);
}
.tk-view:focus { outline: none; }
.tk-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--e1); padding: var(--s4); }
.tk-card-dashed { border-style: dashed; box-shadow: none; }
.tk-gate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s3); padding: var(--s7) var(--s4); }
.tk-gate h1 { margin: 0; }
.tk-gate p { margin: 0; color: var(--muted); max-width: 36rem; }
.tk-actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.tk-loading { display: flex; align-items: center; gap: var(--s3); color: var(--muted); padding: var(--s6) 0; }
.tk-spin {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--navy-500);
  animation: tk-spin 0.8s linear infinite;
}
@keyframes tk-spin { to { transform: rotate(360deg); } }

/* ---------- notes and banners (icon-free; the sentence is the signal) */
.tk-note { border-radius: var(--r-sm); padding: var(--s3) var(--s4); border-left: 4px solid var(--info); background: var(--info-bg); color: var(--info-ink); }
.tk-note-good { border-color: var(--good); background: var(--good-bg); color: var(--good-ink); }
.tk-note-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn-ink); }
.tk-note-crit { border-color: var(--crit); background: var(--crit-bg); color: var(--crit-ink); }
.tk-note p:last-child { margin-bottom: 0; }

/* ---------- status pill (always has text) */
.tk-pill {
  display: inline-flex; align-items: center; gap: var(--s1); border-radius: var(--r-pill);
  padding: 2px var(--s3); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}
.tk-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.tk-pill-info { background: var(--info-bg); color: var(--info-ink); border-color: transparent; }
.tk-pill-good { background: var(--good-bg); color: var(--good-ink); border-color: transparent; }
.tk-pill-warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.tk-pill-crit { background: var(--crit-bg); color: var(--crit-ink); border-color: transparent; }
.tk-pills { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* ---------- buttons and forms (40px touch targets) */
.tk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px;
  padding: var(--s2) var(--s4); border-radius: var(--r-sm); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--navy-800); font-weight: 600; text-decoration: none; cursor: pointer;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.tk-btn:hover { border-color: var(--navy-500); }
.tk-btn:disabled, .tk-btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
.tk-btn-primary { background: var(--navy-500); border-color: var(--navy-500); color: var(--on-dark); }
.tk-btn-primary:hover { background: var(--navy-800); border-color: var(--navy-800); }
.tk-btn-good { background: var(--green-700); border-color: var(--green-700); color: var(--on-dark); }
.tk-btn-danger { background: var(--surface); border-color: var(--crit); color: var(--crit-ink); }
.tk-btn-small { min-height: 36px; padding: var(--s1) var(--s3); font-size: var(--fs-sm); }
.tk-btn-block { width: 100%; }
.tk-form { display: grid; gap: var(--s4); grid-template-columns: 1fr; }
.tk-field { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.tk-field label { font-size: var(--fs-sm); font-weight: 600; color: var(--navy-800); }
.tk-field input, .tk-field select, .tk-field textarea {
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: var(--s2) var(--s3);
  min-height: 44px; background: var(--surface); width: 100%; font-size: 16px;  /* 16px: no zoom on iOS focus */
}
.tk-field textarea { min-height: 88px; }
.tk-field input:disabled, .tk-field select:disabled { background: var(--surface-2); color: var(--muted); }
.tk-field .tk-hint { font-size: var(--fs-xs); color: var(--muted); }
.tk-field .tk-err { font-size: var(--fs-xs); color: var(--crit-ink); }
.tk-field input[aria-invalid="true"], .tk-field select[aria-invalid="true"] { border-color: var(--crit); }
.tk-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }   /* honeypot field */
.tk-check { display: flex; align-items: center; gap: var(--s2); min-height: 44px; font-size: var(--fs-sm); }

/* ---------- tables: a grid on wide screens, a stack of labelled cards on phones */
.tk-table-wrap { overflow-x: auto; }
table.tk-grid { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.tk-grid th, table.tk-grid td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.tk-grid th { background: var(--surface-2); color: var(--navy-800); font-weight: 600; }
table.tk-stack thead { display: none; }
table.tk-stack, table.tk-stack tbody, table.tk-stack tr, table.tk-stack td { display: block; width: 100%; }
table.tk-stack tr { border: 1px solid var(--line); border-radius: var(--r-md); margin-bottom: var(--s3); padding: var(--s2) var(--s3); background: var(--surface); }
table.tk-stack td { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); border: 0; padding: var(--s1) 0; text-align: right; overflow-wrap: anywhere; }
table.tk-stack td::before { content: attr(data-label); color: var(--muted); font-size: var(--fs-xs); text-align: left; flex: none; padding-top: 2px; }
table.tk-stack td:empty { display: none; }

/* ---------- key / value list */
.tk-kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--s1) var(--s4); margin: 0 0 var(--s3); font-size: var(--fs-sm); }
.tk-kv dt { color: var(--muted); }
.tk-kv dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- QR code */
.tk-qr { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto; background: var(--surface); }

/* ---------- modal and toast */
#tk-overlay:empty { display: none; }
.tk-backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.tk-modal {
  position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(520px, calc(100vw - 2 * var(--s4))); max-height: calc(100vh - 2 * var(--s6)); overflow: auto;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--e3); padding: var(--s5);
}
.tk-modal:focus { outline: none; }
.tk-modal-actions { display: flex; gap: var(--s2); flex-wrap: wrap; justify-content: flex-end; margin: var(--s4) 0 var(--s2); }
.tk-toast-slot { position: fixed; left: var(--s4); right: var(--s4); bottom: var(--s4); z-index: 50; display: flex; justify-content: center; pointer-events: none; }
.tk-toast { background: var(--navy-900); color: var(--on-dark); border-radius: var(--r-md); box-shadow: var(--e3); padding: var(--s3) var(--s4); max-width: 420px; font-size: var(--fs-sm); pointer-events: auto; }
.tk-toast-good { border-left: 4px solid var(--green-400); }
.tk-toast-crit { border-left: 4px solid var(--crit); }
.tk-toast-warn { border-left: 4px solid var(--warn); }

/* ---------- register page: event cards, form, receipt */
.tk-ev h2 { overflow-wrap: anywhere; }
/* the event poster from the Hub post: full card width, its own shape (landscape or portrait), the whole poster shown */
.tk-poster { margin: 0 0 var(--s3); width: 100%; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
.tk-poster[hidden] { display: none; }
.tk-poster-img { display: block; width: 100%; height: auto; }
.tk-ev .tk-kv { grid-template-columns: max-content minmax(0, 1fr); }
.tk-hl { border-color: var(--navy-500); box-shadow: 0 0 0 3px var(--info-bg), var(--e2); }
.tk-fee { display: inline-block; font-weight: 600; color: var(--navy-800); margin-right: var(--s3); }
.tk-slot { margin-top: var(--s3); display: grid; gap: var(--s3); }
.tk-slot:empty { display: none; }
.tk-regform .tk-note { margin: 0; }
.tk-pay { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s3) var(--s4); }
.tk-pay p { margin: 0 0 var(--s2); }
.tk-pay p:last-child { margin-bottom: 0; }
.tk-paynote { white-space: pre-line; overflow-wrap: anywhere; margin-top: var(--s4); }
/* payment instructions (president 2026-10-11): clear space after the Amount due line; the renderer draws the first line as a
   bold sub-heading; the pay-later note keeps a little space above it */
.tk-pay p.tk-paynote, .tk-paysec p.tk-paynote, .tk-paycard p.tk-paynote { margin-top: var(--s4); }
.tk-paynote-h { display: block; font-weight: 700; color: var(--navy-800); margin-bottom: var(--s2); }
.tk-paysec .tk-mini, .tk-pay .tk-mini { margin-top: var(--s3); }
.tk-done { display: grid; gap: var(--s2); }
.tk-done h3 { font-size: var(--fs-lg); margin: 0; }
.tk-done p { margin: 0; }
.tk-done:focus { outline: none; }
.tk-done input[readonly] { font-size: var(--fs-sm); }
.tk-ev .tk-actions .tk-btn, .tk-done .tk-actions .tk-btn { flex: 1 1 auto; }

/* ---------- ticket page: the ticket, My tickets list */
.tk-ticket { display: grid; gap: var(--s3); max-width: 520px; margin: 0 auto; width: 100%; }
.tk-ticket > * { margin: 0; min-width: 0; }
.tk-ticket-brand { display: none; align-items: center; gap: var(--s3); }
.tk-ticket-brand .tk-brand-text { display: grid; line-height: 1.25; }
.tk-ticket-brand .tk-brand-text span { color: var(--muted); font-size: var(--fs-sm); }
.tk-ticket-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-ticket-top h1 { margin: 0; }
.tk-tkbanner h2 { margin: 0 0 var(--s1); font-size: var(--fs-lg); color: inherit; }
.tk-tkbanner p { white-space: pre-line; overflow-wrap: anywhere; }
.tk-qrbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3); }
.tk-ticket-note { text-align: center; color: var(--muted); font-size: var(--fs-sm); }
.tk-ticket-no { font-size: var(--fs-lg); text-align: center; }
.tk-ticket .tk-kv { grid-template-columns: max-content minmax(0, 1fr); }
.tk-ticket .tk-actions .tk-btn { flex: 1 1 auto; text-align: center; }
.tk-tlist { display: grid; gap: var(--s3); }
.tk-tcard { display: block; text-decoration: none; color: inherit; overflow-wrap: anywhere; }
a.tk-tcard:hover { border-color: var(--navy-500); }
.tk-tcard h2 { margin: 0 0 var(--s1); }
.tk-tcard p { margin: 0 0 var(--s2); }
.tk-tcard-row { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.tk-tcard-go { color: var(--navy-500); font-weight: 600; font-size: var(--fs-sm); }

/* ---------- check-in page: picker, count, camera, big result card */
.tk-ck { display: grid; gap: var(--s4); }
.tk-ck h1 { margin: 0; }
.tk-ck-pick select { font-size: 16px; }
.tk-ck-top { display: grid; gap: var(--s3); }
.tk-ck-top:empty { display: none; }
.tk-ck-evline { display: grid; gap: var(--s1); overflow-wrap: anywhere; }
.tk-ck-evline b { color: var(--navy-800); font-size: var(--fs-lg); }
.tk-ck-count { margin: 0; font-size: var(--fs-lg); color: var(--navy-800); font-variant-numeric: tabular-nums; }
.tk-ck-count b { font-size: var(--fs-xl); }
.tk-ck-main { display: grid; gap: var(--s4); }
.tk-ck-scan { display: grid; gap: var(--s4); }
.tk-ck-cam[hidden], .tk-ck-camctl [hidden] { display: none; }
.tk-ck-cam { display: grid; gap: var(--s2); }
.tk-ck-video { width: 100%; max-height: 60vh; aspect-ratio: 4 / 3; object-fit: cover; background: var(--navy-900); border-radius: var(--r-md); }
.tk-ck-camtip { margin: 0; text-align: center; }
.tk-ck-camctl { display: grid; gap: var(--s2); }
.tk-ck-btn { min-height: 56px; font-size: var(--fs-lg); }
.tk-ck-manual .tk-field input { min-height: 52px; letter-spacing: 0.02em; }
.tk-res { display: grid; gap: var(--s3); border-width: 2px; border-left-width: 10px; scroll-margin-top: var(--s4); }
.tk-res:focus { outline: none; }
.tk-res-good { border-color: var(--good); background: var(--good-bg); color: var(--good-ink); }
.tk-res-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn-ink); }
.tk-res-info { border-color: var(--info); background: var(--info-bg); color: var(--info-ink); }
.tk-res-crit { border-color: var(--crit); background: var(--crit-bg); color: var(--crit-ink); }
.tk-res-head { display: flex; align-items: center; gap: var(--s3); }
.tk-res-sym {
  flex: none; width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: currentColor; font-size: var(--fs-2xl); font-weight: 700; line-height: 1;
}
.tk-res-sym { -webkit-text-fill-color: var(--surface); }
.tk-res-title { margin: 0; font-size: var(--fs-2xl); line-height: 1.15; color: inherit; overflow-wrap: anywhere; }
.tk-ck-advice { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.tk-res .tk-kv { margin: 0; font-size: var(--fs-md); }
.tk-res .tk-kv dt { color: inherit; opacity: 0.8; }
.tk-ck-name { font-weight: 700; font-size: var(--fs-lg); }
.tk-ck-change { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
.tk-ck-actions { display: grid; gap: var(--s2); }

/* ---------- events console (manage.html): overview cards, tabs, lists */
.tk-mg { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); min-width: 0; }
.tk-mg > * { min-width: 0; }
.tk-mg h1 { margin: 0; overflow-wrap: anywhere; }
.tk-mg-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-mg-evs { display: grid; gap: var(--s4); }
.tk-mg-ev h2 { margin: 0; overflow-wrap: anywhere; }
.tk-mg-evhead, .tk-mg-evline { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-mg-evline { justify-content: flex-start; }
.tk-mg-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2) var(--s4); margin: var(--s3) 0; }
.tk-mg-stat { display: flex; flex-direction: column-reverse; border-top: 1px solid var(--line); padding-top: var(--s2); }

// ---- pages/programme.js
/**
 * pages/programme.js — programme.html: edit the order of proceedings of an event programme page (president 2026-10-15).
 *
 * Who: Hub admins and people with the Hub permission "Manage events" (hub_my_permissions; the SERVER re-checks every call).
 * Data: hub_programme_get(p_page) / hub_programme_save(p_page, p_content) - sql/patches/hub-programme-editor.sql. The page
 * (e.g. gmm2026.html) comes from the address (#page=gmm2026.html; that page by default). The programme page on the chapter
 * site draws what is saved here, and only while the programme is switched on (Events console, Edit sales).
 * Content: {event, details, mc, parts: [{title, items: [{title, who, role, num, style, subs: [{title, who, role}]}]}]}.
 * role = the position shown under the name (2026-10-18). Preview and Download PDF use what is on screen, saved or not; the PDF is
 * drawn in this browser with jsPDF and the EMPOWER fonts and logo (window.CERT_ASSETS, generated by build.py).
 * Editing happens in memory; Save sends the whole programme. Every dynamic string goes through TK.esc. Nothing is stored
 * in the browser, logged or sent anywhere else.
 */
(function (root) {
  'use strict';
  var TK = root.TK || (typeof require === 'function' ? require('../tk-shell.js') : null);
  var esc = TK.esc;
  var doc = root.document;

  var PAGE_RE = /^([A-Za-z0-9_-][A-Za-z0-9._-]{0,60}\/){0,3}[A-Za-z0-9_-][A-Za-z0-9._-]{0,60}\.html$/;
  var SITE = 'https://picpajeddah.github.io/picpa-jeddah-hub/';
  var STYLES = [['', 'Normal'], ['hl', 'Highlighted'], ['round', 'Ceremony'], ['brk', 'Break or meal']];

  // in memory only: me = hub_my_permissions(); data = the last answer of the server; c = the programme being edited
  var S = { me: null, page: 'gmm2026.html', data: null, c: null, notice: null, busy: false };

  function byId(id) { return doc && doc.getElementById ? doc.getElementById(id) : null; }
  function copy(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }
  function str(v) { return v == null ? '' : String(v); }
  function blankItem() { return { title: '', who: '', role: '', num: true, style: '', subs: [] }; }
  function blankSub() { return { title: '', who: '', role: '' }; }
  function blankPart() { return { title: '', items: [blankItem()] }; }
  function pageFromAddress() {
    var h = (root.location && root.location.hash) || '';
    var m = /(?:^#|&)page=([^&]+)/.exec(h);
    var p = '';
    try { p = m ? decodeURIComponent(m[1]) : ''; } catch (e) { p = ''; }
    return PAGE_RE.test(p) ? p : 'gmm2026.html';
  }
  /** A tidy working copy of a saved programme (or a blank one). */
  function working(content) {
    var c = content && typeof content === 'object' ? copy(content) : {};
    var parts = Array.isArray(c.parts) ? c.parts : [];
    return {
      event: str(c.event), details: str(c.details), mc: str(c.mc),
      parts: (parts.length ? parts : [blankPart()]).map(function (p) {
        var items = Array.isArray(p && p.items) ? p.items : [];
        return { title: str(p && p.title), items: items.map(function (it) {
          return { title: str(it.title), who: str(it.who), role: str(it.role), num: it.num === true, style: str(it.style),
            subs: (Array.isArray(it.subs) ? it.subs : []).map(function (s) { return { title: str(s.title), who: str(s.who), role: str(s.role) }; }) };
        }) };
      })
    };
  }

  /** The server's own sentence when it is a plain one (a leading CODE: is dropped); otherwise the shared friendly text. */
  function message(e) {
    if (TK.isTimeout && TK.isTimeout(e)) return TK.MAYBE_SAVED || TK.friendlyError(e);
    if (e && /^(NETWORK|SIGNED_OUT|LIB_MISSING)$/.test(String(e.code || ''))) return TK.friendlyError(e);
    var raw = String((e && e.message) || '').trim();
    var m = /^[A-Z][A-Z0-9_]*:\s*([\s\S]+)$/.exec(raw);
    var text = (m ? m[1] : raw).trim();
    if (text && text.length <= 300 && /^[A-Z]/.test(text) && !/permission denied|violates|syntax|schema cache|relation|column|function/i.test(text)) {
      return text;
    }
    return TK.friendlyError(e);
  }

  // ------------------------------------------------------------------ reading what is on screen
  function el(id) {
    var x = byId(id);
    return x && /^(INPUT|SELECT|TEXTAREA)$/.test(String(x.tagName || '').toUpperCase()) ? x : null;
  }
  function readText(id, fallback) { var x = el(id); return x && typeof x.value === 'string' ? x.value : fallback; }
  function readBox(id, fallback) { var x = el(id); return x && typeof x.checked === 'boolean' ? x.checked : fallback; }
  /** Copy every field on screen into S.c (a field that cannot be read keeps its value). */
  function sync() {
    var c = S.c;
    if (!c) return;
    c.event = readText('pg-event', c.event);
    c.details = readText('pg-details', c.details);
    c.mc = readText('pg-mc', c.mc);
    c.parts.forEach(function (p, pi) {
      var k = 'pg-p' + pi;
      p.title = readText(k + '-t', p.title);
      p.items.forEach(function (it, ii) {
        var q = k + '-i' + ii;
        it.title = readText(q + '-t', it.title);
        it.who = readText(q + '-w', it.who);
        it.role = readText(q + '-r', it.role);
        it.style = readText(q + '-s', it.style);
        it.num = readBox(q + '-n', it.num);
        it.subs.forEach(function (s, si) {
          s.title = readText(q + '-s' + si + '-t', s.title);
          s.who = readText(q + '-s' + si + '-w', s.who);
          s.role = readText(q + '-s' + si + '-r', s.role);
        });
      });
    });
  }

  // ------------------------------------------------------------------ rendering
  function input(id, label, value, extra) {
    return '<div class="tk-field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="text" value="' + esc(value) + '"' +
      (extra || '') + '></div>';
  }
  function btn(action, text, data, cls, label) {
    return '<button type="button" class="tk-btn tk-btn-small' + (cls ? ' ' + cls : '') + '" data-action="' + action + '"' + data +
      (label ? ' aria-label="' + esc(label) + '"' : '') + (S.busy ? ' disabled' : '') + '>' + text + '</button>';
  }
  function subHtml(pi, ii, s, si) {
    var q = 'pg-p' + pi + '-i' + ii + '-s' + si, d = ' data-p="' + pi + '" data-i="' + ii + '" data-s="' + si + '"';
    return '<div class="pg-sub"><div class="pg-grid pg-grid-3">' +
      input(q + '-t', 'Step ' + (si + 1), s.title, ' maxlength="200"') +
      input(q + '-w', 'Person or people (optional)', s.who, ' maxlength="300"') +
      input(q + '-r', 'Position (optional)', s.role, ' maxlength="200" placeholder="e.g. President, PPO-WRSA"') + '</div>' +
      '<div class="pg-tools">' + btn('pg.sub.del', 'Remove step', d, 'tk-btn-danger', 'Remove step ' + (si + 1) + ' of ' + (s.title || 'this item')) + '</div></div>';
  }
  function itemHtml(pi, it, ii, no) {
    var q = 'pg-p' + pi + '-i' + ii, d = ' data-p="' + pi + '" data-i="' + ii + '"';
    var name = it.title || 'item ' + (ii + 1);
    return '<div class="pg-item" id="' + q + '"><div class="pg-itemhead"><span class="pg-no">' + (no ? esc(String(no)) + '.' : '•') + '</span>' +
      '<span class="tk-mini">Item ' + (ii + 1) + ' of Part ' + (pi + 1) + '</span></div>' +
      '<div class="pg-grid">' +
      input(q + '-t', 'Item', it.title, ' maxlength="200"') +
      '<div class="tk-field"><label for="' + q + '-s">Style</label><select id="' + q + '-s">' + STYLES.map(function (s) {
        return '<option value="' + s[0] + '"' + (s[0] === it.style ? ' selected' : '') + '>' + esc(s[1]) + '</option>';
      }).join('') + '</select></div></div>' +
      '<div class="pg-grid pg-grid-2">' +
      input(q + '-w', 'Person or people (optional)', it.who, ' maxlength="300"') +
      input(q + '-r', 'Position (optional)', it.role, ' maxlength="200" placeholder="e.g. President, PPO-WRSA"') + '</div>' +
      '<label class="tk-check"><input type="checkbox" id="' + q + '-n"' + (it.num ? ' checked' : '') + '> Numbered</label>' +
      (it.subs.length ? '<div class="pg-subs"><p class="tk-mini">Steps within this item</p>' +
        it.subs.map(function (s, si) { return subHtml(pi, ii, s, si); }).join('') + '</div>' : '') +
      '<div class="pg-tools">' + btn('pg.sub.add', 'Add a step', d, '', 'Add a step to ' + name) +
      btn('pg.item.up', 'Move up', d, '', 'Move ' + name + ' up') + btn('pg.item.down', 'Move down', d, '', 'Move ' + name + ' down') +
      btn('pg.item.del', 'Remove item', d, 'tk-btn-danger', 'Remove ' + name) + '</div></div>';
  }
  function bodyHtml() {
    var n = 0;
    return '<div class="pg-grid pg-grid-2">' +
      input('pg-event', 'Event title (preview and PDF)', S.c.event, ' maxlength="160" placeholder="e.g. 1st General Membership Meeting & Induction Ceremony"') +
      input('pg-details', 'Date and venue (preview and PDF)', S.c.details, ' maxlength="200" placeholder="e.g. Friday, 23 October 2026 · Jiwar Almasi Hotel, Jeddah"') + '</div>' +
      input('pg-mc', 'Master of the Ceremony', S.c.mc, ' maxlength="200"') +
      S.c.parts.map(function (p, pi) {
        var d = ' data-p="' + pi + '"';
        return '<section class="tk-card pg-part"><div class="pg-parthead"><span class="pg-partk">Part ' + (pi + 1) + '</span>' +
          input('pg-p' + pi + '-t', 'Part title', p.title, ' maxlength="120"') + '</div>' +
          p.items.map(function (it, ii) { return itemHtml(pi, it, ii, it.num ? ++n : 0); }).join('') +
          '<div class="pg-tools">' + btn('pg.item.add', 'Add an item', d, 'tk-btn-primary', 'Add an item to Part ' + (pi + 1)) +
          btn('pg.part.up', 'Move part up', d) + btn('pg.part.down', 'Move part down', d) +
          btn('pg.part.del', 'Remove part', d, 'tk-btn-danger', 'Remove Part ' + (pi + 1)) + '</div></section>';
      }).join('') +
      '<div class="pg-tools pg-addpart">' + btn('pg.part.add', 'Add a part', '') + '</div>';
  }
  function noticeHtml() {
    var n = S.notice;
    if (!n) return '';
    return '<div class="tk-note tk-note-' + esc(n.kind) + '" role="' + (n.kind === 'crit' ? 'alert' : 'status') + '"><p>' + esc(n.text) + '</p></div>';
  }
  function stateLine() {
    var d = S.data || {};
    return d.visible === true ? 'Shown to registrants now: a saved change appears on the programme page at once.'
      : 'Hidden from registrants: switch it on with "Show the programme to registrants" (Events console, Edit sales).';
  }
  function pageHtml() {
    return '<div class="pg"><h1>Event programme</h1>' +
      '<p class="tk-muted">Order of proceedings of <a href="' + esc(SITE + S.page) + '" target="_blank" rel="noopener">' + esc(S.page) + '</a>. ' +
      esc(stateLine()) + '</p>' +
      '<p class="tk-mini">Numbers follow the order of the numbered items. "Steps" appear under an item, for example the two parts of the Induction Proper.</p>' +
      '<div id="pg-notice">' + noticeHtml() + '</div>' +
      '<form class="tk-form" id="pg-form" data-action="pg.save" novalidate><div id="pg-body">' + bodyHtml() + '</div>' +
      '<div class="pg-save"><button type="submit" class="tk-btn tk-btn-primary" id="pg-go"' + (S.busy ? ' disabled' : '') + '>' +
      (S.busy ? 'Saving…' : 'Save programme') + '</button>' +
      '<button type="button" class="tk-btn" data-action="pg.preview">Preview</button>' +
      '<button type="button" class="tk-btn" data-action="pg.pdf" id="pg-pdf">Download PDF</button>' +
      '<a class="tk-btn" href="./manage.html">Events console</a></div></form></div>';
  }
  function deniedHtml() {
    return '<div class="tk-card tk-gate"><h1>Event programme</h1><p>This page is for chapter admins and officers who manage events.</p>' +
      '<div class="tk-actions"><a class="tk-btn tk-btn-primary" href="./officers.html">Back to Officer tools</a></div></div>';
  }
  function redraw() {
    var b = byId('pg-body'); if (b) b.innerHTML = bodyHtml();
    var n = byId('pg-notice'); if (n) n.innerHTML = noticeHtml();
  }
  function showNotice() {
    var n = byId('pg-notice');
    if (!n) return;
    n.innerHTML = noticeHtml();
    if (S.notice && typeof n.scrollIntoView === 'function') { try { n.scrollIntoView({ block: 'nearest' }); } catch (e) { /* old browser */ } }
  }

  // ------------------------------------------------------------------ editing (sync, change, redraw)
  function idx(el, name) { var v = Number(el && el.getAttribute ? el.getAttribute(name) : NaN); return v >= 0 ? v : -1; }
  function move(list, i, by) {
    var j = i + by;
    if (i < 0 || j < 0 || i >= list.length || j >= list.length) return false;
    var x = list[i]; list[i] = list[j]; list[j] = x;
    return true;
  }
  function edit(fn) {
    return function (el) {
      if (S.busy || !S.c) return null;
      sync();
      S.notice = null;
      if (fn(el) !== false) redraw();
      return null;
    };
  }
  function part(el) { return S.c.parts[idx(el, 'data-p')] || null; }
  function item(el) { var p = part(el); return p ? p.items[idx(el, 'data-i')] || null : null; }

  TK.action('pg.part.add', edit(function () { S.c.parts.push(blankPart()); }));
  TK.action('pg.part.up', edit(function (el) { return move(S.c.parts, idx(el, 'data-p'), -1); }));
  TK.action('pg.part.down', edit(function (el) { return move(S.c.parts, idx(el, 'data-p'), 1); }));
  TK.action('pg.part.del', edit(function (el) {
    var i = idx(el, 'data-p');
    if (i < 0 || i >= S.c.parts.length) return false;
    if (S.c.parts.length === 1) { S.notice = { kind: 'warn', text: 'A programme needs at least one part.' }; return; }
    S.c.parts.splice(i, 1);
  }));
  TK.action('pg.item.add', edit(function (el) { var p = part(el); if (!p) return false; p.items.push(blankItem()); }));
  TK.action('pg.item.up', edit(function (el) { var p = part(el); return !!p && move(p.items, idx(el, 'data-i'), -1); }));
  TK.action('pg.item.down', edit(function (el) { var p = part(el); return !!p && move(p.items, idx(el, 'data-i'), 1); }));
  TK.action('pg.item.del', edit(function (el) {
    var p = part(el), i = idx(el, 'data-i');
    if (!p || i < 0 || i >= p.items.length) return false;
    p.items.splice(i, 1);
  }));
  TK.action('pg.sub.add', edit(function (el) {
    var it = item(el);
    if (!it) return false;
    if (it.subs.length >= 10) { S.notice = { kind: 'warn', text: 'An item has at most 10 steps.' }; return; }
    it.subs.push(blankSub());
  }));
  TK.action('pg.sub.del', edit(function (el) {
    var it = item(el), i = idx(el, 'data-s');
    if (!it || i < 0 || i >= it.subs.length) return false;
    it.subs.splice(i, 1);
  }));

  TK.action('pg.save', function () {
    if (S.busy || !S.c) return null;
    sync();
    var content = copy(S.c);
    S.busy = true;
    S.notice = null;
    var go = byId('pg-go');
    if (go) { go.setAttribute('disabled', ''); go.innerHTML = 'Saving…'; }
    showNotice();
    function done() {
      S.busy = false;
      var b = byId('pg-go');
      if (b) { b.removeAttribute('disabled'); b.innerHTML = 'Save programme'; }
    }
    return TK.rpc('hub_programme_save', { p_page: S.page, p_content: content }).then(function (d) {
      done();
      if (d && typeof d === 'object') { S.data = d; S.c = working(d.content); }
      S.notice = { kind: 'good', text: 'Saved. ' + (S.data && S.data.visible === true
        ? 'The programme page shows it the next time it is opened.'
        : 'It stays hidden until "Show the programme to registrants" is ticked in Edit sales.') };
      redraw();
      showNotice();
    }, function (e) {
      done();                                            // what was typed stays on screen, to be corrected and saved again
      S.notice = { kind: 'crit', text: message(e) };
      redraw();
      showNotice();
    });
  });

  // ------------------------------------------------------------------ preview and PDF (what is on screen, saved or not)
  function tidyText(v) { return str(v).trim().replace(/\s+/g, ' '); }
  /** Capitals for headings, keeping ordinals as written on the poster (1st, 2nd, 3rd, 4th). */
  function caps(v) { return str(v).toUpperCase().replace(/(\d)(ST|ND|RD|TH)\b/g, function (m, d, x) { return d + x.toLowerCase(); }); }
  /** The programme as members would see it: texts tidied, empty lines dropped (as the server does on save). */
  function shown(c) {
    return {
      event: tidyText(c.event), details: tidyText(c.details), mc: tidyText(c.mc),
      parts: c.parts.map(function (p) {
        return { title: tidyText(p.title), items: p.items.filter(function (it) { return tidyText(it.title); }).map(function (it) {
          return { title: tidyText(it.title), who: tidyText(it.who), role: tidyText(it.role), num: it.num === true, style: str(it.style),
            subs: it.subs.filter(function (s) { return tidyText(s.title); }).map(function (s) {
              return { title: tidyText(s.title), who: tidyText(s.who), role: tidyText(s.role) };
            }) };
        }) };
      })
    };
  }
  var PV_STYLE = { hl: ' pv-hl', round: ' pv-round', brk: ' pv-brk' };
  function previewHtml(c) {
    var n = 0;
    var h = '<div class="pv"><div class="pv-head"><p class="pv-name">Philippine Institute of Certified Public Accountants<br>Western Region · Jeddah Chapter</p>' +
      '<h2 class="pv-event">' + esc(caps(c.event || 'Programme')) + '</h2>' + (c.details ? '<p class="pv-details">' + esc(c.details) + '</p>' : '') + '</div>';
    c.parts.forEach(function (p, pi) {
      h += '<div class="pv-part"><span class="pv-k">Part ' + (pi + 1) + '</span><h3>' + esc(caps(p.title || 'Untitled part')) + '</h3></div><ol class="pv-tl">';
      p.items.forEach(function (it) {
        var subs = it.subs.length ? '<ol class="pv-subs">' + it.subs.map(function (s) {
          return '<li><span class="pv-st">' + esc(s.title) + '</span>' + (s.who ? '<span class="pv-w">' + esc(s.who) + '</span>' : '') +
            (s.role ? '<span class="pv-r">' + esc(s.role) + '</span>' : '') + '</li>';
        }).join('') + '</ol>' : '';
        h += '<li class="pv-item' + (PV_STYLE[it.style] || '') + '"><span class="pv-no">' + (it.num ? String(++n) : '') + '</span><div class="pv-body">' +
          '<span class="pv-t">' + esc(it.title) + '</span>' + (it.who ? '<span class="pv-w">' + esc(it.who) + '</span>' : '') +
          (it.role ? '<span class="pv-r">' + esc(it.role) + '</span>' : '') + subs + '</div></li>';
      });
      h += '</ol>';
    });
    if (c.mc) h += '<p class="pv-mc">Master of the Ceremony: <b>' + esc(c.mc) + '</b></p>';
    return h + '</div>';
  }

  var NAVY = [2, 29, 107], GOLD = [198, 142, 27], GOLDTXT = [138, 106, 31], INK = [11, 22, 54], MUTED = [74, 85, 112], SUBTLE = [99, 109, 135], LINE = [217, 222, 232];
  /** An A4 programme in the EMPOWER style. lib = jsPDF; A = window.CERT_ASSETS (fonts and logo; without them: Helvetica, no logo). */
  function pdfOf(c, lib, A) {
    var d = new lib({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var fonts = !!(A && A.archivo && A.sgRegular && A.sgBold);
    if (fonts) {
      d.addFileToVFS('ArchivoBlack-Regular.ttf', A.archivo); d.addFont('ArchivoBlack-Regular.ttf', 'Archivo', 'normal');
      d.addFileToVFS('SpaceGrotesk-Regular.ttf', A.sgRegular); d.addFont('SpaceGrotesk-Regular.ttf', 'Grotesk', 'normal');
      d.addFileToVFS('SpaceGrotesk-Bold.ttf', A.sgBold); d.addFont('SpaceGrotesk-Bold.ttf', 'Grotesk', 'bold');
    }
    var DISP = fonts ? 'Archivo' : 'helvetica', SANS = fonts ? 'Grotesk' : 'helvetica', DISP_ST = fonts ? 'normal' : 'bold';
    var W = 210, H = 297, M = 18, BOTTOM = H - 22, y = M;
    var LH = 0.3528 * 1.25;                              // mm per point of font size, at 1.25 line spacing
    function font(f, st, size, col) { d.setFont(f, st); d.setFontSize(size); d.setTextColor(col[0], col[1], col[2]); }
    function fill(col) { d.setFillColor(col[0], col[1], col[2]); }
    function wrap(text, width) { return d.splitTextToSize(String(text), width); }
    function need(h) { if (y + h > BOTTOM) { d.addPage(); y = M + 4; } }

    // heading: logo, chapter line, event title, date and venue, gold rule
    if (A && A.logoJpeg) { var lw = 78, lh = lw * 258 / 1100; d.addImage('data:image/jpeg;base64,' + A.logoJpeg, 'JPEG', (W - lw) / 2, y, lw, lh); y += lh + 8; }
    font(SANS, 'bold', 8, GOLDTXT);
    d.text('PHILIPPINE INSTITUTE OF CERTIFIED PUBLIC ACCOUNTANTS · WESTERN REGION · JEDDAH CHAPTER', W / 2, y, { align: 'center' }); y += 8;
    font(DISP, DISP_ST, 17, NAVY);
    wrap(caps(c.event || 'Programme'), W - 2 * M).forEach(function (l) { d.text(l, W / 2, y, { align: 'center' }); y += 17 * LH; });
    if (c.details) {
      y += 1; font(SANS, 'normal', 10.5, INK);
      wrap(c.details, W - 2 * M).forEach(function (l) { d.text(l, W / 2, y, { align: 'center' }); y += 10.5 * LH; });
    }
    y += 2; fill(GOLD); d.rect(W / 2 - 14, y, 28, 0.9, 'F'); y += 10;

    var n = 0, X = M + 12, TW = W - M - X;
    c.parts.forEach(function (p, pi) {
      need(22);
      var tag = 'PART ' + (pi + 1);
      font(SANS, 'bold', 8, [255, 255, 255]);
      var tw = d.getTextWidth(tag) + 5;
      fill(NAVY); d.rect(M, y - 4.2, tw, 6, 'F'); d.text(tag, M + 2.5, y);
      font(DISP, DISP_ST, 11.5, NAVY);
      var pl = wrap(caps(p.title), W - 2 * M - tw - 4);
      pl.forEach(function (l, i) { d.text(l, M + tw + 4, y + i * 11.5 * LH); });
      y += pl.length * 11.5 * LH + 4;
      p.items.forEach(function (it) {
        var title = wrap(it.title, TW), who = it.who ? wrap(it.who, TW) : [], role = it.role ? wrap(it.role, TW) : [];
        var subs = it.subs.map(function (s) {
          return { t: wrap(s.title, TW - 6), w: s.who ? wrap(s.who, TW - 6) : [], r: s.role ? wrap(s.role, TW - 6) : [] };
        });
        var hSubs = subs.reduce(function (a, s) { return a + s.t.length * 10 * LH + s.w.length * 9 * LH + s.r.length * 8.5 * LH + 1.5; }, subs.length ? 1 : 0);
        need(Math.min(title.length * 11 * LH + who.length * 10 * LH + role.length * 9 * LH + hSubs + 3.5, 60));
        var top = y;
        if (it.num) { font(SANS, 'bold', 11, GOLDTXT); d.text(String(++n), M + 1, y); }
        else { fill(it.style === 'round' ? GOLD : (it.style === 'brk' ? SUBTLE : NAVY)); d.circle(M + 2.6, y - 1.3, 0.9, 'F'); }
        font(SANS, 'bold', 11, it.style === 'brk' ? MUTED : (it.style === 'hl' ? NAVY : INK));
        title.forEach(function (l) { d.text(l, X, y); y += 11 * LH; });
        if (who.length) { font(SANS, 'normal', 10, INK); who.forEach(function (l) { d.text(l, X, y); y += 10 * LH; }); }
        if (role.length) { font(SANS, 'normal', 9, SUBTLE); role.forEach(function (l) { d.text(l, X, y); y += 9 * LH; }); }
        if (subs.length) {
          y += 1;
          var sTop = y - 3.5;
          subs.forEach(function (s) {
            font(SANS, 'bold', 10, MUTED); s.t.forEach(function (l) { d.text(l, X + 5, y); y += 10 * LH; });
            if (s.w.length) { font(SANS, 'normal', 9, INK); s.w.forEach(function (l) { d.text(l, X + 5, y); y += 9 * LH; }); }
            if (s.r.length) { font(SANS, 'normal', 8.5, SUBTLE); s.r.forEach(function (l) { d.text(l, X + 5, y); y += 8.5 * LH; }); }
            y += 1.5;
          });
          d.setDrawColor(LINE[0], LINE[1], LINE[2]); d.setLineWidth(0.6); d.line(X + 1, Math.max(sTop, top), X + 1, y - 3.5);
        }
        y += 3.5;
      });
      y += 4;
    });
    if (c.mc) {
      need(14);
      d.setDrawColor(LINE[0], LINE[1], LINE[2]); d.setLineWidth(0.3); d.line(M, y, W - M, y); y += 8;
      var lead = 'Master of the Ceremony: ';
      font(SANS, 'normal', 10.5, MUTED); var w1 = d.getTextWidth(lead);
      font(SANS, 'bold', 10.5, NAVY); var w2 = d.getTextWidth(c.mc);
      var x0 = Math.max(M, (W - w1 - w2) / 2);
      font(SANS, 'normal', 10.5, MUTED); d.text(lead, x0, y);
      font(SANS, 'bold', 10.5, NAVY); d.text(c.mc, x0 + w1, y);
    }
    var pages = d.getNumberOfPages();
    for (var i = 1; i <= pages; i++) {
      d.setPage(i);
      fill(GOLD); d.rect(0, H - 4, W, 4, 'F');
      font(SANS, 'normal', 7.5, SUBTLE);
      d.text('Philippine Institute of Certified Public Accountants · Western Region · Jeddah Chapter', M, H - 10);
      if (pages > 1) d.text('Page ' + i + ' of ' + pages, W - M, H - 10, { align: 'right' });
    }
    return d;
  }
  function pdfName() { return 'Programme-' + S.page.replace(/\.html$/, '').replace(/[^A-Za-z0-9_-]+/g, '-') + '.pdf'; }

  TK.action('pg.preview', function () {
    if (!S.c) return null;
    sync();
    TK.modal('<div class="pv-wrap"><div class="pv-bar"><h2>Preview</h2><p class="tk-mini">As members see it, including changes not yet saved.</p></div>' +
      previewHtml(shown(S.c)) +
      '<div class="tk-modal-actions"><button type="button" class="tk-btn tk-btn-primary" data-action="pg.pdf">Download PDF</button>' +
      '<button type="button" class="tk-btn" data-action="tk.closeModal">Close</button></div></div>', { label: 'Programme preview' });
    return null;
  });
  TK.action('pg.pdf', function () {
    if (!S.c) return null;
    sync();
    var lib = root.jspdf && root.jspdf.jsPDF;
    if (!lib) { TK.toast('The PDF tool is still loading. Wait a moment and press Download PDF again.', 'warn'); return null; }
    try {
      pdfOf(shown(S.c), lib, root.CERT_ASSETS).save(pdfName());
      TK.toast('PDF downloaded: ' + pdfName() + '. It shows what is on screen, including changes not yet saved.', 'good');
    } catch (e) {
      TK.toast('The PDF could not be made. Reload the page and try again.', 'crit');
    }
    return null;
  });

  TK.registerPage({
    id: 'programme',
    title: 'Event programme',
    access: 'signedin',                                 // the page then checks admin / Manage events; the server checks every call
    render: function () {
      S.notice = null; S.busy = false;
      S.page = pageFromAddress();
      return TK.rpc('hub_my_permissions').then(function (me) {
        S.me = me && typeof me === 'object' ? me : {};
        if (S.me.admin !== true && S.me.manage_events !== true) return deniedHtml();
        return TK.rpc('hub_programme_get', { p_page: S.page }).then(function (d) {
          S.data = d && typeof d === 'object' ? d : {};
          S.c = working(S.data.content);
          return pageHtml();
        });
      });
    }
  });

  // test hook (Node only): the in-memory state
  if (typeof module === 'object' && module.exports) module.exports = { state: S, message: message, working: working, caps: caps, shown: shown, previewHtml: previewHtml, pdfOf: pdfOf, pdfName: pdfName };
}(typeof window !== 'undefined' ? window : globalThis));
</script>
<script>TK.start();</script>
</body>
