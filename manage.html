<style id="tk-style">
/* tk.css — styles of the ticketing pages on Hub v2.2 tokens. Colours appear ONLY in the :root token block.
   Mobile first: the base rules are the phone layout; min-width queries widen it. Class prefix: tk-. */
:root {
  /* brand */
  --navy-900: #0B1540;
  --navy-800: #101E5A;
  --navy-700: #16297A;
  --navy-500: #2149D6;
  --navy-100: #E6ECFB;
  --green-700: #1E6B22;
  --green-500: #3FA62B;
  --green-400: #52A828;
  --green-100: #E8F5E3;
  /* status (each with -ink for text on -bg) */
  --info: #2149D6;  --info-ink: #17349A;  --info-bg: #E8EEFC;
  --good: #1E7A2E;  --good-ink: #155A21;  --good-bg: #E6F4E8;
  --warn: #CA8A04;  --warn-ink: #7A5203;  --warn-bg: #FEF6DC;
  --crit: #DC2626;  --crit-ink: #991B1B;  --crit-bg: #FDECEC;
  /* neutrals */
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8F9FC;
  --line: #DDE2EC;
  --line-strong: #C5CCDA;
  --text: #172033;
  --muted: #5B6478;
  --on-dark: #FFFFFF;
  --on-dark-muted: #B9C3E6;
  --focus: #2149D6;
  --scrim: rgba(11, 21, 64, 0.45);
  /* type */
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px;
  /* spacing, 4px base */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px;
  --s6: 24px; --s7: 32px; --s8: 40px; --s9: 48px; --s10: 64px;
  /* radii */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  /* elevation */
  --e1: 0 1px 2px rgba(11, 21, 64, 0.06), 0 1px 1px rgba(11, 21, 64, 0.04);
  --e2: 0 4px 12px rgba(11, 21, 64, 0.08), 0 1px 3px rgba(11, 21, 64, 0.06);
  --e3: 0 16px 40px rgba(11, 21, 64, 0.18), 0 4px 12px rgba(11, 21, 64, 0.08);
  /* motion */
  --t-fast: 120ms; --t-med: 200ms; --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  /* page width */
  --page-w: 960px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: var(--fs-md); line-height: 1.5; font-feature-settings: 'tnum' 1, 'cv11' 1;
}
a { color: var(--navy-500); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { color: var(--navy-800); line-height: 1.25; margin: 0 0 var(--s3); }
h1 { font-size: var(--fs-xl); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: var(--fs-md); }
p { margin: 0 0 var(--s3); }
.tk-muted { color: var(--muted); }
.tk-mini { font-size: var(--fs-xs); color: var(--muted); }
.tk-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tk-nowrap { white-space: nowrap; }
.tk-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tk-skip { position: absolute; left: -999px; top: var(--s2); }
.tk-skip:focus { left: var(--s2); z-index: 100; background: var(--surface); padding: var(--s2) var(--s3); border-radius: var(--r-sm); }

/* ---------- header */
.tk-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.tk-head-in {
  max-width: var(--page-w); margin: 0 auto; padding: var(--s3) var(--s4);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap;
}
.tk-brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.tk-brand-mark { flex: none; width: 40px; height: 40px; }
.tk-brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.tk-brand-text b { font-size: var(--fs-sm); color: var(--navy-800); }
.tk-brand-text span { font-size: var(--fs-xs); color: var(--green-700); font-weight: 600; }
.tk-back {
  display: inline-flex; align-items: center; min-height: 40px; padding: var(--s1) var(--s3);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); text-decoration: none;
  font-size: var(--fs-sm); font-weight: 600; color: var(--navy-800); background: var(--surface);
}
.tk-back:hover { border-color: var(--navy-500); }
.tk-head-links { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.tk-nav { display: flex; gap: var(--s2); flex-wrap: wrap; }
.tk-navlink {
  display: inline-flex; align-items: center; min-height: 40px; padding: var(--s1) var(--s3);
  border-radius: var(--r-sm); text-decoration: none; font-size: var(--fs-sm); font-weight: 600; color: var(--navy-500);
}
.tk-navlink:hover, .tk-navlink:focus-visible { text-decoration: underline; }

/* ---------- page */
.tk-banner:empty { display: none; }
.tk-banner { max-width: var(--page-w); margin: var(--s4) auto 0; padding: 0 var(--s4); }
.tk-view {
  max-width: var(--page-w); margin: 0 auto; padding: var(--s5) var(--s4) var(--s8);
  display: flex; flex-direction: column; gap: var(--s4);
}
.tk-view:focus { outline: none; }
.tk-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--e1); padding: var(--s4); }
.tk-card-dashed { border-style: dashed; box-shadow: none; }
.tk-gate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s3); padding: var(--s7) var(--s4); }
.tk-gate h1 { margin: 0; }
.tk-gate p { margin: 0; color: var(--muted); max-width: 36rem; }
.tk-actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.tk-loading { display: flex; align-items: center; gap: var(--s3); color: var(--muted); padding: var(--s6) 0; }
.tk-spin {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--navy-500);
  animation: tk-spin 0.8s linear infinite;
}
@keyframes tk-spin { to { transform: rotate(360deg); } }

/* ---------- notes and banners (icon-free; the sentence is the signal) */
.tk-note { border-radius: var(--r-sm); padding: var(--s3) var(--s4); border-left: 4px solid var(--info); background: var(--info-bg); color: var(--info-ink); }
.tk-note-good { border-color: var(--good); background: var(--good-bg); color: var(--good-ink); }
.tk-note-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn-ink); }
.tk-note-crit { border-color: var(--crit); background: var(--crit-bg); color: var(--crit-ink); }
.tk-note p:last-child { margin-bottom: 0; }

/* ---------- status pill (always has text) */
.tk-pill {
  display: inline-flex; align-items: center; gap: var(--s1); border-radius: var(--r-pill);
  padding: 2px var(--s3); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}
.tk-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.tk-pill-info { background: var(--info-bg); color: var(--info-ink); border-color: transparent; }
.tk-pill-good { background: var(--good-bg); color: var(--good-ink); border-color: transparent; }
.tk-pill-warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.tk-pill-crit { background: var(--crit-bg); color: var(--crit-ink); border-color: transparent; }
.tk-pills { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* ---------- buttons and forms (40px touch targets) */
.tk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px;
  padding: var(--s2) var(--s4); border-radius: var(--r-sm); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--navy-800); font-weight: 600; text-decoration: none; cursor: pointer;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.tk-btn:hover { border-color: var(--navy-500); }
.tk-btn:disabled, .tk-btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
.tk-btn-primary { background: var(--navy-500); border-color: var(--navy-500); color: var(--on-dark); }
.tk-btn-primary:hover { background: var(--navy-800); border-color: var(--navy-800); }
.tk-btn-good { background: var(--green-700); border-color: var(--green-700); color: var(--on-dark); }
.tk-btn-danger { background: var(--surface); border-color: var(--crit); color: var(--crit-ink); }
.tk-btn-small { min-height: 36px; padding: var(--s1) var(--s3); font-size: var(--fs-sm); }
.tk-btn-block { width: 100%; }
.tk-form { display: grid; gap: var(--s4); grid-template-columns: 1fr; }
.tk-field { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.tk-field label { font-size: var(--fs-sm); font-weight: 600; color: var(--navy-800); }
.tk-field input, .tk-field select, .tk-field textarea {
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: var(--s2) var(--s3);
  min-height: 44px; background: var(--surface); width: 100%; font-size: 16px;  /* 16px: no zoom on iOS focus */
}
.tk-field textarea { min-height: 88px; }
.tk-field input:disabled, .tk-field select:disabled { background: var(--surface-2); color: var(--muted); }
.tk-field .tk-hint { font-size: var(--fs-xs); color: var(--muted); }
.tk-field .tk-err { font-size: var(--fs-xs); color: var(--crit-ink); }
.tk-field input[aria-invalid="true"], .tk-field select[aria-invalid="true"] { border-color: var(--crit); }
.tk-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }   /* honeypot field */
.tk-check { display: flex; align-items: center; gap: var(--s2); min-height: 44px; font-size: var(--fs-sm); }

/* ---------- tables: a grid on wide screens, a stack of labelled cards on phones */
.tk-table-wrap { overflow-x: auto; }
table.tk-grid { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.tk-grid th, table.tk-grid td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.tk-grid th { background: var(--surface-2); color: var(--navy-800); font-weight: 600; }
table.tk-stack thead { display: none; }
table.tk-stack, table.tk-stack tbody, table.tk-stack tr, table.tk-stack td { display: block; width: 100%; }
table.tk-stack tr { border: 1px solid var(--line); border-radius: var(--r-md); margin-bottom: var(--s3); padding: var(--s2) var(--s3); background: var(--surface); }
table.tk-stack td { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); border: 0; padding: var(--s1) 0; text-align: right; overflow-wrap: anywhere; }
table.tk-stack td::before { content: attr(data-label); color: var(--muted); font-size: var(--fs-xs); text-align: left; flex: none; padding-top: 2px; }
table.tk-stack td:empty { display: none; }

/* ---------- key / value list */
.tk-kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--s1) var(--s4); margin: 0 0 var(--s3); font-size: var(--fs-sm); }
.tk-kv dt { color: var(--muted); }
.tk-kv dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- QR code */
.tk-qr { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto; background: var(--surface); }

/* ---------- modal and toast */
#tk-overlay:empty { display: none; }
.tk-backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.tk-modal {
  position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(520px, calc(100vw - 2 * var(--s4))); max-height: calc(100vh - 2 * var(--s6)); overflow: auto;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--e3); padding: var(--s5);
}
.tk-modal:focus { outline: none; }
.tk-modal-actions { display: flex; gap: var(--s2); flex-wrap: wrap; justify-content: flex-end; margin: var(--s4) 0 var(--s2); }
.tk-toast-slot { position: fixed; left: var(--s4); right: var(--s4); bottom: var(--s4); z-index: 50; display: flex; justify-content: center; pointer-events: none; }
.tk-toast { background: var(--navy-900); color: var(--on-dark); border-radius: var(--r-md); box-shadow: var(--e3); padding: var(--s3) var(--s4); max-width: 420px; font-size: var(--fs-sm); pointer-events: auto; }
.tk-toast-good { border-left: 4px solid var(--green-400); }
.tk-toast-crit { border-left: 4px solid var(--crit); }
.tk-toast-warn { border-left: 4px solid var(--warn); }

/* ---------- register page: event cards, form, receipt */
.tk-ev h2 { overflow-wrap: anywhere; }
/* the event poster from the Hub post: full card width, its own shape (landscape or portrait), the whole poster shown */
.tk-poster { margin: 0 0 var(--s3); width: 100%; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
.tk-poster[hidden] { display: none; }
.tk-poster-img { display: block; width: 100%; height: auto; }
.tk-ev .tk-kv { grid-template-columns: max-content minmax(0, 1fr); }
.tk-hl { border-color: var(--navy-500); box-shadow: 0 0 0 3px var(--info-bg), var(--e2); }
.tk-fee { display: inline-block; font-weight: 600; color: var(--navy-800); margin-right: var(--s3); }
.tk-slot { margin-top: var(--s3); display: grid; gap: var(--s3); }
.tk-slot:empty { display: none; }
.tk-regform .tk-note { margin: 0; }
.tk-pay { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s3) var(--s4); }
.tk-pay p { margin: 0 0 var(--s2); }
.tk-pay p:last-child { margin-bottom: 0; }
.tk-paynote { white-space: pre-line; overflow-wrap: anywhere; margin-top: var(--s4); }
/* payment instructions (president 2026-10-11): clear space after the Amount due line; the renderer draws the first line as a
   bold sub-heading; the pay-later note keeps a little space above it */
.tk-pay p.tk-paynote, .tk-paysec p.tk-paynote, .tk-paycard p.tk-paynote { margin-top: var(--s4); }
.tk-paynote-h { display: block; font-weight: 700; color: var(--navy-800); margin-bottom: var(--s2); }
.tk-paysec .tk-mini, .tk-pay .tk-mini { margin-top: var(--s3); }
.tk-done { display: grid; gap: var(--s2); }
.tk-done h3 { font-size: var(--fs-lg); margin: 0; }
.tk-done p { margin: 0; }
.tk-done:focus { outline: none; }
.tk-done input[readonly] { font-size: var(--fs-sm); }
.tk-ev .tk-actions .tk-btn, .tk-done .tk-actions .tk-btn { flex: 1 1 auto; }

/* ---------- ticket page: the ticket, My tickets list */
.tk-ticket { display: grid; gap: var(--s3); max-width: 520px; margin: 0 auto; width: 100%; }
.tk-ticket > * { margin: 0; min-width: 0; }
.tk-ticket-brand { display: none; align-items: center; gap: var(--s3); }
.tk-ticket-brand .tk-brand-text { display: grid; line-height: 1.25; }
.tk-ticket-brand .tk-brand-text span { color: var(--muted); font-size: var(--fs-sm); }
.tk-ticket-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-ticket-top h1 { margin: 0; }
.tk-tkbanner h2 { margin: 0 0 var(--s1); font-size: var(--fs-lg); color: inherit; }
.tk-tkbanner p { white-space: pre-line; overflow-wrap: anywhere; }
.tk-qrbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3); }
.tk-ticket-note { text-align: center; color: var(--muted); font-size: var(--fs-sm); }
.tk-ticket-no { font-size: var(--fs-lg); text-align: center; }
.tk-ticket .tk-kv { grid-template-columns: max-content minmax(0, 1fr); }
.tk-ticket .tk-actions .tk-btn { flex: 1 1 auto; text-align: center; }
.tk-tlist { display: grid; gap: var(--s3); }
.tk-tcard { display: block; text-decoration: none; color: inherit; overflow-wrap: anywhere; }
a.tk-tcard:hover { border-color: var(--navy-500); }
.tk-tcard h2 { margin: 0 0 var(--s1); }
.tk-tcard p { margin: 0 0 var(--s2); }
.tk-tcard-row { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.tk-tcard-go { color: var(--navy-500); font-weight: 600; font-size: var(--fs-sm); }

/* ---------- check-in page: picker, count, camera, big result card */
.tk-ck { display: grid; gap: var(--s4); }
.tk-ck h1 { margin: 0; }
.tk-ck-pick select { font-size: 16px; }
.tk-ck-top { display: grid; gap: var(--s3); }
.tk-ck-top:empty { display: none; }
.tk-ck-evline { display: grid; gap: var(--s1); overflow-wrap: anywhere; }
.tk-ck-evline b { color: var(--navy-800); font-size: var(--fs-lg); }
.tk-ck-count { margin: 0; font-size: var(--fs-lg); color: var(--navy-800); font-variant-numeric: tabular-nums; }
.tk-ck-count b { font-size: var(--fs-xl); }
.tk-ck-main { display: grid; gap: var(--s4); }
.tk-ck-scan { display: grid; gap: var(--s4); }
.tk-ck-cam[hidden], .tk-ck-camctl [hidden] { display: none; }
.tk-ck-cam { display: grid; gap: var(--s2); }
.tk-ck-video { width: 100%; max-height: 60vh; aspect-ratio: 4 / 3; object-fit: cover; background: var(--navy-900); border-radius: var(--r-md); }
.tk-ck-camtip { margin: 0; text-align: center; }
.tk-ck-camctl { display: grid; gap: var(--s2); }
.tk-ck-btn { min-height: 56px; font-size: var(--fs-lg); }
.tk-ck-manual .tk-field input { min-height: 52px; letter-spacing: 0.02em; }
.tk-res { display: grid; gap: var(--s3); border-width: 2px; border-left-width: 10px; scroll-margin-top: var(--s4); }
.tk-res:focus { outline: none; }
.tk-res-good { border-color: var(--good); background: var(--good-bg); color: var(--good-ink); }
.tk-res-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn-ink); }
.tk-res-info { border-color: var(--info); background: var(--info-bg); color: var(--info-ink); }
.tk-res-crit { border-color: var(--crit); background: var(--crit-bg); color: var(--crit-ink); }
.tk-res-head { display: flex; align-items: center; gap: var(--s3); }
.tk-res-sym {
  flex: none; width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: currentColor; font-size: var(--fs-2xl); font-weight: 700; line-height: 1;
}
.tk-res-sym { -webkit-text-fill-color: var(--surface); }
.tk-res-title { margin: 0; font-size: var(--fs-2xl); line-height: 1.15; color: inherit; overflow-wrap: anywhere; }
.tk-ck-advice { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.tk-res .tk-kv { margin: 0; font-size: var(--fs-md); }
.tk-res .tk-kv dt { color: inherit; opacity: 0.8; }
.tk-ck-name { font-weight: 700; font-size: var(--fs-lg); }
.tk-ck-change { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
.tk-ck-actions { display: grid; gap: var(--s2); }

/* ---------- events console (manage.html): overview cards, tabs, lists */
.tk-mg { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); min-width: 0; }
.tk-mg > * { min-width: 0; }
.tk-mg h1 { margin: 0; overflow-wrap: anywhere; }
.tk-mg-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-mg-evs { display: grid; gap: var(--s4); }
.tk-mg-ev h2 { margin: 0; overflow-wrap: anywhere; }
.tk-mg-evhead, .tk-mg-evline { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-mg-evline { justify-content: flex-start; }
.tk-mg-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2) var(--s4); margin: var(--s3) 0; }
.tk-mg-stat { display: flex; flex-direction: column-reverse; border-top: 1px solid var(--line); padding-top: var(--s2); }
.tk-mg-stat dt { font-size: var(--fs-xs); color: var(--muted); }
.tk-mg-stat dd { margin: 0; font-weight: 700; font-size: var(--fs-md); color: var(--navy-800); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tk-mg-ev .tk-note { margin: 0 0 var(--s2); }
.tk-mg-refunds { margin: var(--s2) 0 0; padding-left: var(--s5); }

        : bankp + ' pending tickets carry a bank reference') + ' — check the bank statement. The holder may already have ' +
        'transferred money before the event was cancelled; refund it if it arrived.</p></div>';

    var rej = num(e.receipts_rejected);
    if (rej > 0) {
      out += '<div class="tk-note tk-note-warn"><p>' + (rej === 1 ? '1 receipt was' : rej + ' receipts were') +

      out += '<div class="tk-note tk-note-warn"><p>Ticket ' + esc(r.ticket_no) + ': receipt ' + esc(r.doc) + ' is ' + esc(r.status) +

    });
    var refunds = listOf(e.refund_receipts), due = num(e.refund_due);

        }).join('') + '</ul>';
      }
      out += '</div>';
    }
    return out;
  }

  /** The registration's own mode (STC Pay / bank / cash), used as the default of the confirm (Approve) step. */
  var MODES = ['stcpay', 'bank', 'cash'];
  function defaultMode(t) { return t && MODES.indexOf(t.payment_mode) >= 0 ? t.payment_mode : 'cash'; }
  // console labels, as stored (president 2026-10-11): STC Pay / Cash / Bank transfer
  // plain words for the export (president 2026-10-24): Paid / Unpaid / Free; a refused OR counts as Unpaid
  var PAY_STATUS = { free: 'Free', pending: 'Unpaid', confirmed: 'Paid', cancelled: 'Unpaid (cancelled)', refund_due: 'Paid (refund due)' };
  function methodLabel(m) { return m === 'cash' ? 'Cash' : TK.METHOD_LABEL[m] || (m === 'free' ? 'Free' : ''); }
  /** The reference the registrant gave (11-payment-proof.sql), else the bank reference of older tickets. */
  function refOf(t, lead) { return (lead && lead.payment_reference) || t.payment_reference || t.bank_ref || (lead && lead.bank_ref) || ''; }
  function confirmStepHtml(t, g) {
    var mode = MODES.indexOf(S.confirmMode) >= 0 ? S.confirmMode : defaultMode(t);
    var lead = g ? g.lead : t, ref = refOf(t, lead);

    var amt = atCost ? noShowFee() : num(t.fee_sar);
    var aopt = function (v, label) { return '<option value="' + v + '"' + ((v === 'cost') === atCost ? ' selected' : '') + '>' + label + '</option>'; };
    return '<div class="tk-mg-confirm"><p>' + (g

      : 'Confirm <b>' + esc(money(amt)) + '</b> received from <b>' + esc(t.holder_name) + '</b>' +
        (atCost ? ' (did not attend: venue cost only, discount ' + esc(money(num(t.fee_sar) - amt)) + ')' : '') + '? This posts a Ledger receipt.') + '</p>' +
      (cost ? '<div class="tk-field tk-mg-cmode"><label for="mg-c-amt">Amount</label><select id="mg-c-amt" name="amt" data-change="cn.confirm.amt"' + dis + '>' +
        aopt('cost', 'Venue cost only (did not attend): ' + esc(money(noShowFee()))) + aopt('full', 'Full ticket price: ' + esc(money(t.fee_sar))) +
        '</select></div>' : '') +
      '<p class="tk-mini">Method: ' + esc(methodLabel(t.payment_mode) || 'Not stated') + ' · Reference: ' + esc(ref || 'None') +
      (lead.proof_path ? ' · Proof of payment attached' : ' · No proof of payment') + '</p>' +
      (needsReconfirm(t) ? '<p class="tk-mini">The earlier receipt ' + esc(t.receipt_doc || '') + ' was ' + esc(t.receipt_status) +
        ' in the Ledger. Confirm only if the money has now arrived; a new receipt is made.</p>' : '') +
      '<div class="tk-field tk-mg-cmode"><label for="mg-c-mode">Received by</label>' +
      '<select id="mg-c-mode" name="mode" data-change="cn.confirm.mode"' + dis + '>' + opt('stcpay', 'STC Pay') + opt('bank', 'Bank transfer') + opt('cash', 'Cash') +
      '</select></div><div class="tk-actions">' +
      '<button type="button" class="tk-btn tk-btn-good tk-btn-small" data-action="cn.confirm.go" data-id="' + esc(t.id) + '"' + dis + '>Confirm</button>' +
      '<button type="button" class="tk-btn tk-btn-small" data-action="cn.confirm.back"' + dis + '>Back</button></div></div>';

  /** A paid ticket whose receipt the Ledger refused (Rejected / Cancelled) counts as unpaid and may be confirmed again
   *  (the server re-posts: a new receipt replaces the refused one). */
  function needsReconfirm(t) {
    return !!t && t.status === 'active' && t.payment_status === 'confirmed' &&
      (t.receipt_status === 'Rejected' || t.receipt_status === 'Cancelled');
  }
  /** Tickets the officer can confirm: waiting for payment, or paid with a refused receipt. */
  function confirmable(t) { return !!t && ((t.payment_status === 'pending' && t.status === 'active') || needsReconfirm(t)); }

  // ---- Payments to review (11-payment-proof.sql): one line per registration (a group = ONE line, its registrant's proof)
  var PFILTERS = [['open', 'Open (awaiting payment, pending review, rejected)'], ['pending_review', 'Pending review'],
    ['awaiting', 'Awaiting payment'], ['rejected', 'Rejected'], ['approved', 'Approved'], ['all', 'All']];
  /** Every paying registration of the event that is still active: [{t (the ticket the actions use), g (group or null), lead, rows,
   *  total, size, status}], ordered by the registrant's ticket number. status: awaiting | pending_review | rejected | approved. */
  function payEntries() {
    var out = [], seen = {};
    (S.tickets || []).forEach(function (t) {
      if (t.status !== 'active' || !(num(t.fee_sar) > 0) || (t.payment_status !== 'pending' && t.payment_status !== 'confirmed')) return;
      var key = t.group_id || t.id;
      var e = seen[key];
      if (!e) {
        var lead = t.group_id ? (ticketOf(t.group_id) || t) : t;
        e = seen[key] = { t: null, lead: lead, rows: [], total: 0, g: null };
        out.push(e);
      }
      e.rows.push(t);
      e.total += num(t.fee_sar) - num(t.discount_sar);   // a no-show paid at venue cost (hub-no-show-cost.sql)
      if (!e.t && confirmable(t)) e.t = t;
    });
    out.forEach(function (e) {
      if (!e.t) e.t = e.lead.fee_sar > 0 ? e.lead : e.rows[0];
      if (e.lead.group_id) e.g = { lead: e.lead, name: e.lead.holder_name, rows: e.rows, total: e.total, size: e.rows.length };
      var open = e.rows.some(confirmable), ps = e.lead.proof_status;
      e.status = !open ? 'approved' : ps === 'pending_review' || ps === 'rejected' ? ps : 'awaiting';
    });
    return out.sort(function (x, y) { return x.lead.ticket_no < y.lead.ticket_no ? -1 : x.lead.ticket_no > y.lead.ticket_no ? 1 : 0; });
  }
  function inFilter(e) {
    var f = S.pfilter || 'open';
    return f === 'all' || (f === 'open' ? e.status !== 'approved' : e.status === f);
  }
  function statusDetail(e) {
    if (e.status === 'approved') return (e.rows.filter(function (x) { return x.receipt_doc; })[0] || {}).receipt_doc || '';
    if (e.status === 'rejected') return e.lead.proof_reject_reason || '';
    return '';
  }
  function proofLinkHtml(id) {
    var l = S.proofLinks && S.proofLinks[id];
    if (!l || Date.now() - l.at > 110000) return '';                   // the signed link lasts 2 minutes
    return '<a class="tk-btn tk-btn-small" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">Open proof</a>' +
      '<span class="tk-mini"> Link valid for 2 minutes.</span>';
  }
  function pendingListHtml() {
    var all = payEntries(), rows = all.filter(inFilter);
    if (!rows.length) {
      return '<p class="tk-muted">' + (!all.length ? 'No payments are recorded for this event.'
        : (S.pfilter || 'open') === 'open' ? 'No payments are waiting.' : 'No payments match this filter.') + '</p>';
    }
    var write = canWrite() && !eventCancelled(), dis = S.busy ? ' disabled' : '';
    // one card per registration (president 2026-10-13: the nine-column table squeezed the names and hid the buttons)
    return '<div class="tk-mg-paylist">' + rows.map(function (e) {
        var t = e.t, g = e.g, lead = e.lead;
        var others = g ? groupActive(lead.id).length - 1 : 0;
        var no = g ? lead.ticket_no + (others > 0 ? ' (+' + others + ')' : '') : t.ticket_no;
        // equal prices are never itemised; the price per attendee only when the group's prices differ
        var same = !g || g.rows.every(function (x) { return num(x.fee_sar) === num(g.rows[0].fee_sar); });
        var people = g ? '<ul class="tk-mg-people">' + g.rows.map(function (x) {
          return '<li>' + esc(x.holder_name) + ' <span class="tk-muted">· ' + typeLabel(x) + (same ? '' : ' · ' + esc(money(x.fee_sar))) + '</span></li>';
        }).join('') + '</ul>' : '';
        var acts = '';
        if (write && confirmable(t)) {
          acts += S.confirming === t.id ? confirmStepHtml(t, g)
            : '<button type="button" class="tk-btn tk-btn-good tk-btn-small" data-action="cn.confirm" data-id="' + esc(t.id) + '"' + dis + '>' +
              (needsReconfirm(t) ? 'Confirm again' : 'Approve') + '</button>';
        }
        if (write && S.confirming !== t.id && (e.status === 'awaiting' || e.status === 'pending_review') && !needsReconfirm(t)) {
          acts += ' <button type="button" class="tk-btn tk-btn-danger tk-btn-small" data-action="cn.reject" data-id="' + esc(lead.id) + '"' + dis + '>Reject</button>';
        }
        if (lead.proof_path && S.confirming !== t.id && canReadProof()) {
          acts += ' ' + (proofLinkHtml(lead.id) || '<button type="button" class="tk-btn tk-btn-small" data-action="cn.proof" data-id="' + esc(lead.id) + '">View proof</button>');
        }
        var ref = refOf(t, lead), sub = lead.proof_submitted_at ? TK.when(lead.proof_submitted_at) : '';
        var facts = [esc(methodLabel(t.payment_mode))];
        if (ref) facts.push('Ref. ' + esc(ref));
        if (sub) facts.push('Proof submitted ' + esc(sub));
        return '<div class="tk-mg-paycard">' +
          '<div class="tk-mg-payhead"><div class="tk-mg-paywho"><b>' + esc(g ? g.name : t.holder_name) + '</b>' +
          '<span class="tk-mini">' + esc(no) + ' · ' + (g ? g.size + (g.size === 1 ? ' attendee' : ' attendees') : typeLabel(t)) + '</span></div>' +
          '<div class="tk-mg-payamt">' + esc(money(e.total)) + '</div></div>' +
          people +
          '<div class="tk-mg-payfoot"><div class="tk-pills">' + TK.proofPill(e.status, statusDetail(e)) +
          (needsReconfirm(t) ? TK.pill('warn', 'Receipt ' + t.receipt_status + ': counts as unpaid') : '') +
          (t.no_show_at && !t.checked_in_at ? TK.pill('warn', 'Did not attend') : '') + '</div>' +
          '<span class="tk-mini">' + facts.join(' · ') + '</span></div>' +
          (acts ? '<div class="tk-mg-acts">' + acts + '</div>' : '') + '</div>';
      }).join('') + '</div>';

  function matches(t, q) {
    if (!q) return true;
    return String(t.holder_name || '').toLowerCase().indexOf(q) >= 0 || String(t.ticket_no || '').toLowerCase().indexOf(q) >= 0 ||
      String(t.phone || '').toLowerCase().indexOf(q) >= 0;
  }
  function attendeeStatus(t) {
    var s = '<div class="tk-pills">';
    if (t.status === 'cancelled' && t.payment_status !== 'cancelled' && t.payment_status !== 'refund_due') s += TK.pill('neutral', 'Cancelled');
    else s += TK.payPill(t.payment_status);
    if (t.checked_in_at) s += TK.pill('info', 'Checked in');
    else if (t.no_show_at) s += TK.pill('warn', 'Did not attend');
    if (t.payment_status === 'confirmed' && (t.receipt_status === 'Rejected' || t.receipt_status === 'Cancelled')) {
      s += TK.pill('warn', 'Receipt ' + t.receipt_status + ': counts as unpaid');
    }
    s += '</div>';
    if (t.receipt_doc) s += '<div class="tk-mini">Receipt ' + esc(t.receipt_doc) + (t.receipt_status ? ' (' + esc(t.receipt_status) + ')' : '') +
      (num(t.discount_sar) > 0 ? ' · venue cost ' + esc(money(num(t.fee_sar) - num(t.discount_sar))) + ', discount ' + esc(money(t.discount_sar)) : '') + '</div>';
    return s;
  }
  /** The venue cost per person for no-shows: managers set it; everyone sees it once set. */
  function noShowFeeHtml() {
    var fee = noShowFee();
    if (!canManage()) {
      return fee === null ? '' : '<p class="tk-mini">Venue cost for those who did not attend: ' + esc(money(fee)) + ' per person.</p>';
    }
    var dis = S.busy ? ' disabled' : '';
    return '<form class="tk-form tk-mg-nsfee" data-action="cn.nsfee" novalidate style="margin-bottom:var(--s3)">' +
      '<div class="tk-field"><label for="mg-nsfee">Venue cost per person for those who did not attend (SAR)</label>' +
      '<input id="mg-nsfee" name="fee" type="number" min="1" step="0.01" inputmode="decimal" value="' + (fee === null ? '' : esc(String(fee))) + '"' + dis + '></div>' +
      '<p class="tk-mini">Only a ticket tagged "Did not attend" can be paid at this amount instead of the full price.</p>' +
      '<div class="tk-actions"><button type="submit" class="tk-btn tk-btn-small"' + dis + '>Save venue cost</button></div></form>';
  }
  function attendeesListHtml() {
    var q = String(S.search || '').trim().toLowerCase();
    var rows = (S.tickets || []).filter(function (t) { return matches(t, q); });
    if (!rows.length) return '<p class="tk-muted">' + ((S.tickets || []).length ? 'No tickets match your search.' : 'No tickets yet.') + '</p>';
    var showCancel = canCancel();
    function cancelBtn(t) {
      var dis = S.busy ? ' disabled' : '';
      if (t.group_id && t.group_id === t.id) {
        // the registrant (president 2026-10-13): "Cancel group" while others are active; once alone, "Cancel ticket"
        var others = groupMembers(t.group_id).some(function (x) { return x.id !== t.id && x.status === 'active'; });
        var open = groupMembers(t.group_id).some(function (x) { return x.status === 'active' && !x.checked_in_at; });
        if (others) {
          return open ? '<button type="button" class="tk-btn tk-btn-danger tk-btn-small" data-action="cn.gcancel" data-id="' +
            esc(t.id) + '"' + dis + '>Cancel group</button>' : '';
        }
      }
      // a single ticket, one companion of a group, or a registrant left alone: this ticket only
      return t.status === 'active' && !t.checked_in_at ? '<button type="button" class="tk-btn tk-btn-danger tk-btn-small" data-action="cn.cancel" data-id="' +
        esc(t.id) + '"' + dis + '>Cancel ticket</button>' : '';
    }
    // one card per ticket (president 2026-10-13: the table squeezed the Cancel buttons into a one-letter column)
    var started = eventStarted();
    function noShowBtn(t) {
      if (!showCancel || !started || t.status !== 'active' || t.checked_in_at) return '';
      var dis = S.busy ? ' disabled' : '';
      if (!t.no_show_at) return '<button type="button" class="tk-btn tk-btn-small" data-action="cn.noshow" data-on="1" data-id="' + esc(t.id) + '"' + dis + '>Mark did not attend</button>';
      if (num(t.discount_sar) > 0 && t.payment_status === 'confirmed') return '';
      return '<button type="button" class="tk-btn tk-btn-small" data-action="cn.noshow" data-on="0" data-id="' + esc(t.id) + '"' + dis + '>Undo did not attend</button>';
    }
    return noShowFeeHtml() + '<div class="tk-mg-paylist tk-mg-attlist">' + rows.map(function (t) {
      var btn = [noShowBtn(t), showCancel ? cancelBtn(t) : ''].filter(Boolean).join(' ');
      var facts = [esc(t.ticket_no)];
      if (t.phone) facts.push(esc(t.phone));
      return '<div class="tk-mg-paycard">' +
        '<div class="tk-mg-payhead"><div class="tk-mg-paywho"><b>' + esc(t.holder_name) + '</b>' +
        '<span class="tk-mini">' + typeLabel(t) + ' · ' + facts.join(' · ') + '</span>' + groupLine(t) + '</div>' +
        '<div class="tk-mg-payamt">' + esc(money(t.fee_sar)) + '</div></div>' +
        '<div class="tk-mg-payfoot">' + attendeeStatus(t) + '</div>' +
        (btn ? '<div class="tk-mg-acts">' + btn + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function countsLine() {
    var l = S.tickets || [], c = { paid: 0, pending: 0, free: 0, checked: 0, cancelled: 0 };
    l.forEach(function (t) {
      if (t.status === 'cancelled' || t.payment_status === 'cancelled' || t.payment_status === 'refund_due') c.cancelled++;
      else if (t.payment_status === 'confirmed') c.paid++;
      else if (t.payment_status === 'pending') c.pending++;
      else if (t.payment_status === 'free') c.free++;
      if (t.checked_in_at) c.checked++;
    });
    return l.length + ' ticket' + (l.length === 1 ? '' : 's') + ' · ' + c.paid + ' paid · ' + c.pending + ' unpaid · ' + c.free + ' free · ' +
      c.checked + ' checked in · ' + c.cancelled + ' cancelled';
  }

  // ------------------------------------------------------------------ drawing
  function drawNotice() { TK.setHTML('mg-notice', noticeHtml(S.notice)); }
  function drawList() { if (S.eventId && (S.tab === 'pending' || S.tab === 'attendees')) TK.setHTML('mg-list', listBodyHtml()); }
  function drawPanel() {

  /** After a list (re)load: redraw only what depends on the list, so a search being typed (Attendees) or a walk-in
   *  form being filled in (Walk-in) is never wiped. Export shows the count, so its panel is redrawn. */
  function drawAfterLoad() {

      if (S.tab === 'attendees') TK.setHTML('mg-counts', esc(S.tickets ? countsLine() : ''));

  function noAccess() {
    S.seq += 1;
    TK.closeModal();
    TK.setHTML('tk-view', '<div class="tk-card tk-gate"><h1>You don\'t have access to this page</h1>' +
      '<p>The events console is for chapter officers. If you were just given access, check again.</p>' +
      '<div class="tk-actions"><a class="tk-btn tk-btn-primary" href="./">Back to the Hub</a>' +
      '<button type="button" class="tk-btn" data-action="tk.refresh">Check again</button></div></div>');
  }

  // ------------------------------------------------------------------ loading (never rejects)
  function loadSummary(force) {
    var seq = S.seq;
    function go() {
      var id = ++S.sumId;
      return TK.rpc('ticketing_event_summary').then(function (list) {
        if (id !== S.sumId || seq !== S.seq) return;
        if (!Array.isArray(list)) throw TK.makeError('UNKNOWN');
        S.summary = list;
        if (!S.eventId) drawPage();
      }).then(null, function (err) {
        if (id !== S.sumId || seq !== S.seq) return;
        if (err && err.code === 'TKT_NO_ACCESS') { noAccess(); return; }
        if (!S.eventId) setNotice('crit', [friendly(err)]);
      });
    }
    return force ? go() : TK.guard('mg.summary.' + seq, go);
  }

  /** The published Hub events (ticketing_list_hub_events). A failure keeps the ticketed events and says so plainly. */
  function hubNote(err) { return 'The list of Hub events without ticket sales could not be loaded: ' + friendly(err) + ' Ticketed events are shown below.'; }
  function loadHub(force) {
    var seq = S.seq;
    function go() {
      var id = ++S.hubId;
      return TK.rpc('ticketing_list_hub_events').then(function (list) {
        if (id !== S.hubId || seq !== S.seq) return;
        if (!Array.isArray(list)) throw TK.makeError('UNKNOWN');
        S.hub = list;
        if (!S.eventId) drawPage();
      }).then(null, function (err) {
        if (id !== S.hubId || seq !== S.seq) return;
        if (err && err.code === 'TKT_NO_ACCESS') { noAccess(); return; }
        if (!S.eventId && !S.setupId) setNotice('warn', [hubNote(err)]);
      });
    }
    return force ? go() : TK.guard('mg.hub.' + seq, go);
  }
  function loadLists(force) { return Promise.all([loadSummary(force), loadHub(force)]); }

  function loadTickets(force) {
    var ev = S.eventId, seq = S.seq;
    if (!ev) return Promise.resolve();
    function current(id) { return id === S.loadId && S.eventId === ev && S.seq === seq; }
    function go() {
      var id = ++S.loadId;
      return TK.rpc('ticketing_list_tickets', { p_announcement: ev }).then(function (list) {
        if (!current(id)) return;
        if (!Array.isArray(list)) throw TK.makeError('UNKNOWN');
        S.tickets = list;
        S.listError = '';
      }).then(null, function (err) {
        if (!current(id)) return;
        if (err && err.code === 'TKT_NO_ACCESS') { noAccess(); return; }
        S.listError = friendly(err);
      }).then(function () {
        if (current(id)) safe(drawAfterLoad);
      });
    }
    return force ? go() : TK.guard('mg.tickets.' + ev + '.' + seq, go);
  }

  // ------------------------------------------------------------------ one mutating call at a time
  /**
   * h.ok(res) runs for a fresh reply (may return a promise); h.err(err) for a fresh failure or a throw inside ok;
   * h.stale(res) when the page was redrawn or the event changed meanwhile (res is the answer, null on failure);
   * h.done() after every call that is still on the same render. busy is always released.
   */
  function run(call, h) {
    var ev = S.eventId, seq = S.seq;
    S.busy = true;
    safe(drawList);
    function fresh() { return S.eventId === ev && S.seq === seq; }
    return Promise.resolve().then(call).then(function (res) {
      if (!fresh()) { if (h.stale) safe(h.stale, res); return undefined; }
      return h.ok(res);
    }).then(null, function (err) {
      if (!fresh()) { if (h.stale) safe(h.stale, null); return; }
      safe(h.err, err);
    }).then(function () {
      if (S.seq !== seq) return;
      S.busy = false;
      if (h.done) safe(h.done);
      safe(drawList);
    });
  }

  // ------------------------------------------------------------------ actions: navigation
  function enter(id, tab) {
    S.seq += 1;
    S.busy = false;
    S.eventId = id;
    S.setupId = null;
    S.saved = null;
    S.stopAsk = false;
    S.tab = tab;
    S.tickets = null;
    S.listError = '';
    S.search = '';
    S.notice = null;
    S.cancelId = null;
    S.gcancelId = null;
    S.confirming = null;
    S.confirmMode = null;
    S.pfilter = 'open';
    S.proofLinks = {};
    S.rejectId = null;
    TK.closeModal();
  }
  TK.action('cn.open', function (el) {
    var id = el && el.getAttribute ? el.getAttribute('data-id') : '';
    if (!id || !evRow(id)) return null;
    enter(id, 'pending');
    drawPage();
    return loadTickets();
  });
  TK.action('cn.back', function () {
    S.seq += 1;
    S.busy = false;
    S.eventId = null;
    S.setupId = null;
    S.saved = null;
    S.stopAsk = false;
    S.tickets = null;
    S.notice = null;
    TK.closeModal();
    drawPage();
    return loadLists();
  });
  TK.action('cn.refresh', function () { S.notice = null; return loadLists(true); });
  TK.action('cn.tab', function (el) {
    var t = el && el.getAttribute ? el.getAttribute('data-tab') : '';
    if (!S.eventId || !TABS.some(function (x) { return x[0] === t; })) return null;
    S.tab = t;
    S.notice = null;
    S.confirming = null;
    S.search = '';
    drawPage();
    return t === 'walkin' ? null : loadTickets();
  });
  TK.action('cn.reload', function () { S.listError = ''; drawPanel(); return loadTickets(true); });
  TK.action('cn.search', function (el) {
    S.search = String(el && el.value != null ? el.value : '');
    drawList();
    return null;
  });

  // ------------------------------------------------------------------ actions: did not attend / venue cost (hub-no-show-cost.sql)
  TK.action('cn.noshow', function (el) {
    var id = el && el.getAttribute ? el.getAttribute('data-id') : '';
    var on = !!el && !!el.getAttribute && el.getAttribute('data-on') === '1';
    var t = ticketOf(id);
    if (!t || !canCancel() || S.busy || eventCancelled()) return null;
    var who = t.holder_name + ' (' + t.ticket_no + ')';
    return run(function () { return TK.rpc('ticketing_mark_no_show', { p_ticket: id, p_on: on }); }, {
      ok: function () {
        setNotice('good', [on ? who + ' is tagged "Did not attend".' : 'The "Did not attend" tag was removed from ' + who + '.']);
        return loadTickets(true);
      },
      err: function (err) {
        if (err && err.code === 'TKT_NO_ACCESS') { noAccess(); return; }
        setNotice('crit', [friendly(err)]);
      }
    });
  });
  TK.action('cn.nsfee', function (form) {
    if (!canManage() || S.busy || !S.eventId) return null;
    var f = field(form, 'fee'), raw = String(f && f.value != null ? f.value : '').trim();
    var v = raw === '' ? null : Number(raw);
    if (v !== null && (!(v > 0) || v > 100000 || Math.round(v * 100) !== v * 100)) {
      setNotice('crit', ['Enter the venue cost per person in SAR, for example 80.']);
      return null;
    }
    var ev = S.eventId;
    return run(function () { return TK.rpc('ticketing_set_no_show_fee', { p_announcement: ev, p_amount: v }); }, {
      ok: function () {
        setNotice('good', [v === null ? 'The venue cost was cleared.' : 'Venue cost saved: ' + money(v) + ' per person.']);
        return loadTickets(true);
      },
      err: function (err) {
        if (err && err.code === 'TKT_NO_ACCESS') { noAccess(); return; }
        setNotice('crit', [friendly(err)]);
      }
    });
  });

  // ------------------------------------------------------------------ actions: confirm payment
  TK.action('cn.confirm', function (el) {

    '.rp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s2) var(--s5)}' +
    '.rp h3{color:var(--green-700);margin:var(--s4) 0 var(--s2);font-size:var(--fs-md)}' +
    'table.tk-grid.rp-t th{background:var(--navy-800);color:white;vertical-align:bottom}table.tk-grid.rp-t .r{text-align:right;font-variant-numeric:tabular-nums}' +
    'table.tk-grid.rp-t tr.rp-tot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--navy-800)}' +
    '.rp-bar{display:inline-block;height:.6rem;background:var(--green-500);border-radius:2px;vertical-align:middle;margin-right:.35rem}' +
    '.rp-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);margin-top:var(--s6,2.5rem)}.rp-sign div{border-top:1px solid var(--text);padding-top:var(--s1);font-size:var(--fs-xs);color:var(--muted)}' +
    '.rp-only-print{display:none}' +
    '@media print{body *{visibility:hidden}#mg-report,#mg-report *{visibility:visible}#mg-report{position:absolute;left:0;top:0;width:100%}' +
    '.rp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rp .tk-table-wrap{overflow:visible}table.tk-grid.rp-t{font-size:7.5pt}' +
    'table.tk-grid.rp-t td,table.tk-grid.rp-t th{padding:2px 4px}.rp-kpis{grid-template-columns:repeat(6,1fr)}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    '.rp-no-print{display:none!important}.rp-only-print{display:block}.rp h3{break-after:avoid}.rp-t{break-inside:auto}.rp-t tr{break-inside:avoid}' +
    '@page{size:A4 landscape;margin:12mm}}' +
    '</style>';
  function reportHtml() {
    if (S.listError) return '<h2>Report</h2>' + listErrorHtml();
    if (S.tickets === null) return '<h2>Report</h2>' + loadingHtml();
    var e = curEvent() || {}, h = hubRow(S.eventId), R = reportRows(S.tickets), s = reportStats(R), C = R_COL;
    if (!R.length) return '<h2>Report</h2><p class="tk-muted">There are no tickets for this event yet.</p>';
    var kpi = function (label, value, sub) { return '<div class="rp-kpi"><i>' + esc(label) + '</i><b>' + value + '</b><span>' + esc(sub) + '</span></div>'; };
    var methodRows = ['Cash', 'STC Pay', 'Bank transfer', 'Free', 'Not stated'].filter(function (m) { return s.method[m]; }).map(function (m) {
      var o = s.method[m];
      return [esc(m), n0(o.n), n0(o.billed), n0(o.collected), n0(o.outstanding), pct(s.collected ? o.collected / s.collected : 0)];
    });
    var statusRows = Object.keys(s.status).map(function (k) { var o = s.status[k]; return [esc(k), n0(o.n), n0(o.billed), n0(o.collected), pct(o.n / s.issued)]; });
    var desigRows = ['Member', 'Officer', 'Guest'].filter(function (d) { return s.desig[d]; }).map(function (d) {
      var o = s.desig[d];
      return [esc(d), n0(o.n), n0(o.attended), pct(o.attended / o.n), n0(o.collected), pct(o.n / s.issued)];
    });
    var attRows = ['Attended', 'Did not attend', 'Not checked in'].filter(function (a) { return s.att[a]; }).map(function (a) {
      var o = s.att[a];
      return [esc(a), n0(o.n), n0(o.paid), n0(o.unpaid), '<span class="rp-bar" style="width:' + Math.round(60 * o.n / s.issued) + 'px"></span>' + pct(o.n / s.issued)];
    });
    var confRows = Object.keys(s.conf).sort().map(function (k) { var o = s.conf[k]; return [esc(k), n0(o.n), n0(o.collected), pct(s.collected ? o.collected / s.collected : 0)]; });
    var confN = Object.keys(s.conf).reduce(function (a, k) { return a + s.conf[k].n; }, 0);
    var cinRows = Object.keys(s.cin).sort().map(function (k) { return [esc(k), n0(s.cin[k].n), pct(s.attended ? s.cin[k].n / s.attended : 0)]; });
    var ck = s.checks;
    var checkRows = [['Unpaid tickets', ck.unpaid, 'Follow up, or tag "Did not attend" for the venue cost'],
      ['Paid without OR no.', ck.noOr, 'Every paid ticket should carry an OR'],
      ['STC Pay without reference', ck.noRef, 'Transfer reference not captured'],
      ['OR still "Submitted"', ck.submitted, 'Receipts awaiting the Treasurer\'s approval'],
      ['Paid but did not attend', ck.noshow, 'Paid no-shows (see the list)'],
      ['Tickets sharing an OR no.', ck.shared, 'Registrant and companions on one OR'],
      ['Tagged "Did not attend"', ck.tagged, 'Venue cost applies to unpaid tickets'],
      ['Discounts granted (SAR)', ck.discounts, 'See Discount reason in the Excel report'],
      ['Cancelled tickets', ck.cancelled, 'See Cancellation reason in the Excel report']].map(function (c) { return [esc(c[0]), n0(c[1]), esc(c[2])]; });
    var days = Object.keys(s.days).sort(), cumN = 0, cumC = 0;
    var dayRows = days.map(function (d) {
      var o = s.days[d]; cumN += o.n; cumC += o.collected;
      return [esc(TK.when(d + 'T12:00:00+03:00').replace(/,.*$/, '')), n0(o.n), n0(cumN), n0(o.collected), n0(cumC)];
    });
    var unpaidRows = s.unpaid.map(function (r) { return [esc(r[C.no]), esc(r[C.name]), esc(r[C.type]), n0(r[C.fee]), esc(r[C.method])]; });
    var noshowRows = s.noshow.map(function (r) { return [esc(r[C.no]), esc(r[C.name]), esc(r[C.type]), esc(r[C.method]), esc(r[C.or])]; });
    var when = (e.event_date ? TK.when(e.event_date) : '') + (h && h.venue ? ' · ' + h.venue : '');
    return REPORT_CSS + '<div class="rp" id="mg-report">' +
      '<div class="tk-actions rp-no-print" style="justify-content:flex-end"><button type="button" class="tk-btn tk-btn-primary tk-btn-small" data-action="cn.xlsx">Download Excel report</button>' +
      '<button type="button" class="tk-btn tk-btn-small" data-action="cn.print">Print / Save as PDF</button></div>' +
      '<h2 style="margin:0;color:var(--navy-800)">' + esc(e.title || 'Event') + ' — Payments &amp; Attendance Report</h2>' +
      '<p class="tk-muted" style="margin:.2rem 0 0">' + esc(when) + (e.ticket_ref ? ' · ' + esc(e.ticket_ref) : '') +
      ' · PICPA Western Region – Jeddah Chapter · as of ' + esc(TK.when(new Date().toISOString())) + '</p>' +
      '<div class="rp-kpis">' + kpi('TICKETS ISSUED', n0(s.issued), s.active + ' active · ' + s.cancelled + ' cancelled') +
      kpi('ATTENDED', n0(s.attended), pct(s.issued ? s.attended / s.issued : 0) + ' of tickets checked in') +
      kpi('TOTAL BILLED', esc(sar0(s.billed)), 'Discounts: ' + sar0(s.discounts)) +
      kpi('COLLECTED', esc(sar0(s.collected)), s.paidN + ' paid tickets') +
      kpi('OUTSTANDING', esc(sar0(s.outstanding)), s.unpaidN + ' unpaid tickets') +
      kpi('COLLECTION RATE', pct(s.rate), 'Collected ÷ (collected + outstanding)') + '</div>' +
      '<div class="rp-grid"><div><h3>Payment method</h3>' + rtable(['Method', 'Tickets', 'Billed (SAR)', 'Collected (SAR)', 'Outstanding (SAR)', 'Share of collected'], methodRows,
        ['Total', n0(s.issued), n0(s.billed), n0(s.collected), n0(s.outstanding), pct(s.collected ? 1 : 0)], [1, 2, 3, 4, 5]) + '</div>' +
      '<div><h3>Payment status</h3>' + rtable(['Status', 'Tickets', 'Billed (SAR)', 'Collected (SAR)', 'Share of tickets'], statusRows,
        ['Total', n0(s.issued), n0(s.billed), n0(s.collected), '100.0%'], [1, 2, 3, 4]) + '</div>' +
      '<div><h3>By designation</h3>' + rtable(['Designation', 'Tickets', 'Attended', 'Attendance rate', 'Collected (SAR)', 'Share of tickets'], desigRows,
        ['Total', n0(s.issued), n0(s.attended), pct(s.issued ? s.attended / s.issued : 0), n0(s.collected), '100.0%'], [1, 2, 3, 4, 5]) + '</div>' +
      '<div><h3>Attendance</h3>' + rtable(['Attendance', 'Tickets', 'Paid', 'Unpaid', 'Share of tickets'], attRows,
        ['Total', n0(s.issued), n0(s.paidN), n0(s.unpaidN), '100.0%'], [1, 2, 3, 4]) + '</div>' +
      '<div><h3>Payments confirmed by</h3>' + rtable(['Confirmed by (Hub account)', 'Tickets', 'Collected (SAR)', 'Share of collected'], confRows,
        ['Total', n0(confN), n0(s.collected), pct(s.collected ? 1 : 0)], [1, 2, 3]) + '</div>' +
      '<div><h3>Check-ins by officer</h3>' + rtable(['Checked in by', 'Check-ins', 'Share'], cinRows, ['Total', n0(s.attended), pct(s.attended ? 1 : 0)], [1, 2]) + '</div>' +
      '<div><h3>Data checks &amp; exceptions</h3>' + rtable(['Check', 'Count', 'Note'], checkRows, null, [1]) + '</div>' +
      '<div><h3>Registrations &amp; collections timeline</h3>' + rtable(['Date', 'Registrations', 'Cumulative', 'Collected (SAR)', 'Cumulative (SAR)'], dayRows, null, [1, 2, 3, 4]) + '</div>' +
      '<div><h3>Outstanding — unpaid tickets</h3>' + (unpaidRows.length ? rtable(['Ticket no', 'Name', 'Designation', 'Fee (SAR)', 'Method'], unpaidRows, null, [3]) : '<p class="tk-muted">None.</p>') + '</div>' +
      '<div><h3>Paid but did not attend</h3>' + (noshowRows.length ? rtable(['Ticket no', 'Name', 'Designation', 'Method', 'OR no.'], noshowRows) : '<p class="tk-muted">None.</p>') + '</div></div>' +
      '<div class="rp-sign"><div>Prepared by — name, signature and date</div><div>Reviewed by (Treasurer) — name, signature and date</div><div>Noted by (President) — name, signature and date</div></div>' +
      '<p class="tk-mini rp-no-print" style="margin-top:var(--s3)">The Excel report has the same dashboard with charts, plus every ticket in the Payments sheet. ' +
      'Its figures recalculate when it is opened in Excel (Microsoft 365 or Excel 2021 and later).</p></div>';
  }
  function downloadBytes(name, bytes, type) {
    if (typeof root.Blob !== 'function' || !root.URL || typeof root.URL.createObjectURL !== 'function' || !doc || !doc.createElement) return false;
    var url = root.URL.createObjectURL(new root.Blob([bytes], { type: type }));
    var a = doc.createElement('a');
    a.href = url;
    a.download = name;
    if (doc.body && doc.body.appendChild) safe(function () { doc.body.appendChild(a); });
    a.click();
    if (doc.body && doc.body.removeChild) safe(function () { doc.body.removeChild(a); });
    if (root.setTimeout && root.URL.revokeObjectURL) root.setTimeout(function () { safe(function () { root.URL.revokeObjectURL(url); }); }, 4000);
    return true;
  }
  TK.action('cn.xlsx', function () {
    var e = curEvent(), h = e ? hubRow(e.announcement_id) : null;
    if (!e || !S.tickets || !S.tickets.length) return null;
    var ref = String(e.ticket_ref || '').replace(/[^A-Za-z0-9_-]/g, '') || 'event';
    var ok = false;
    try {
      var bytes = TK.reportXlsx.build(root.REPORT_TEMPLATE, reportRows(S.tickets), {
        title: e.title || '', code: e.ticket_ref || '', generated: TK.when(new Date().toISOString()),
        when: (e.event_date ? TK.when(e.event_date) : '') + (h && h.venue ? ' · ' + h.venue : '') });
      ok = downloadBytes('Event-report-' + ref + '-' + TK.localISO(new Date()) + '.xlsx', bytes,
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    } catch (err) { ok = false; }
    if (ok) setNotice('good', ['The Excel report was saved to this device. Open it in Excel; the dashboard calculates when it opens.']);
    else setNotice('crit', ['This browser can\'t save the Excel report. Try another browser (Chrome or Edge on a computer).']);
    return null;
  });
  TK.action('cn.print', function () {
    if (typeof root.print === 'function') root.print();
    return null;
  });

  // ------------------------------------------------------------------ page
  TK.registerPage({
    id: 'manage',
    title: 'Events console',
    access: 'officer',
    render: function (ctx) {
      S.seq += 1;
      S.busy = false;
      S.access = ctx.access;
      S.eventId = null;
      S.tab = 'pending';
      S.pfilter = 'open';
      S.proofLinks = {};
      S.tickets = null;
      S.listError = '';
      S.search = '';
      S.notice = null;
      S.cancelId = null;
      S.setupId = null;
      S.saved = null;
      S.stopAsk = false;
      S.hub = null;
      TK.closeModal();
      // the Hub events list is fetched alongside; its failure never hides the ticketed events (a plain note instead)
      var hub = TK.rpc('ticketing_list_hub_events').then(function (l) { return { list: l }; }, function (e) { return { err: e }; });
      return Promise.all([TK.rpc('ticketing_event_summary'), hub]).then(function (r) {
        var list = r[0], hr = r[1];
        S.summary = Array.isArray(list) ? list : [];
        if (hr.err || !Array.isArray(hr.list)) S.notice = { kind: 'warn', lines: [hubNote(hr.err || TK.makeError('UNKNOWN'))] };
        else S.hub = hr.list;
        if (ctx.eventId && evRow(ctx.eventId)) { S.eventId = ctx.eventId; S.tab = 'attendees'; S.notice = null; }
        return { html: '<div class="tk-mg" id="mg-page"></div>', mount: function () { drawPage(); if (S.eventId) loadTickets(); } };
      }, function (err) {
        if (err && err.code === 'TKT_NO_ACCESS') return { html: '<div id="mg-page"></div>', mount: noAccess };
        throw err;
      });
    }
  });

  TK.managePage = { buildCsv: buildCsv, buildReconCsv: buildReconCsv, reportRows: reportRows, reportStats: reportStats };
}(typeof window !== 'undefined' ? window : globalThis));
</script>
<script>TK.start();</script>
</body>
